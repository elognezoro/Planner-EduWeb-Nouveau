oisissez l'un des cinq principes (dignité, bien commun, destination universelle des biens, subsidiarité, solidarité) et formulez 3 questions d'audit que ce principe pose à un système d'IA de votre établissement. Modèle (subsidiarité) : « La communauté peut-elle corriger la décision de l'algorithme ? ». On agrégera les contributions en une grille commune (5 principes × 3 questions), réutilisée dans les modules suivants.","placeholder":"Principe retenu :\n1. Question d'audit…\n2. Question d'audit…\n3. Question d'audit…","criteres":["Dignité — le système traite-t-il chaque élève comme une personne, jamais comme « moins digne » ni exclu sans possibilité d'appel (§104) ?","Bien commun — cet usage crée-t-il les conditions de l'épanouissement de tous, ou l'avantage de quelques-uns ?","Destination universelle des biens — l'accès à l'outil et à ses bénéfices est-il équitable entre élèves et familles ?","Subsidiarité — la communauté et l'enseignant peuvent-ils contester et corriger la décision de l'algorithme (§108-109) ?","Solidarité — le dispositif reconnaît-il le travail invisible et se lie-t-il d'abord aux plus fragiles ?","Chaque question est concrète, vérifiable, et rapportée à un usage réel de l'IA dans l'établissement"]}},{"t":"Glossaire vivant (Moodle)","d":"Sept entrées à retenir : retournez chaque carte pour la définition sourcée.","kind":"flashcards","data":{"consigne":"Cliquez pour retourner. Recto : le terme ; verso : sa définition avec la référence (§ ou chapitre).","cartes":[{"recto":"Imago Dei","verso":"L'être humain créé à l'image de Dieu, fondement de la dignité inaliénable de tous (Ch. 2 ; Gn 1, 26-27)."},{"recto":"Dignité","verso":"Valeur reçue et inaliénable de la personne, non conférée par ses performances ; un système qui exclut « sans possibilité d'appel » la contredit (§104 ; Dignitas infinita)."},{"recto":"Subsidiarité","verso":"Décider au niveau le plus proche des personnes concernées, sans déposséder les communautés (§108-109). Audit : la communauté peut-elle corriger l'algorithme ?"},{"recto":"Solidarité","verso":"Reconnaître le travail invisible et se lier aux plus fragiles ; refuser que l'efficacité prime sur les liens (Ch. 2)."},{"recto":"Bien commun","verso":"L'ensemble des conditions sociales permettant l'épanouissement de tous, et non l'avantage de quelques-uns (Ch. 2)."},{"recto":"Développement humain intégral","verso":"Développement de « tout l'homme et de tout homme » ; horizon de la DSE (Populorum progressio ; §82)."},{"recto":"Anthropocentrisme situé","verso":"Vision de l'être humain inséré dans un réseau de relations avec les autres vivants et la création (§237)."}]}}],"M2":[{"t":"Étude de cas (jigsaw, 60 min)","d":"Quatre cas de la vie civile, une seule grille : passez le vôtre au crible de la Doctrine sociale.","kind":"atelier","data":{"consigne":"En groupe, prenez UN des quatre cas (santé ; administration publique ; agriculture/climat ; inclusion/handicap) et évaluez-le avec la grille DSE co-construite au M1. Puis, en jigsaw, restituez au grand groupe : bénéfice réel, condition de validité, alerte principale — votre cas éclaire les autres.","placeholder":"Cas choisi : … / Bénéfice réel : … / Condition de validité : … / Alerte principale : …","criteres":["Cas retenu : santé, administration publique, agriculture/climat ou inclusion/handicap ?","Bénéfice réel : en quoi sert-il concrètement la personne et le développement humain intégral (§93) ?","Condition de validité (règle d'or du module) : l'usage sert la personne, reste sous responsabilité humaine, et n'aggrave ni les inégalités ni l'empreinte écologique.","Grille DSE — dignité : le système respecte-t-il la personne ou la réduit-il à une simple donnée ?","Grille DSE — subsidiarité : la communauté peut-elle corriger ou contester la décision de l'algorithme ?","Grille DSE — bien commun & destination universelle des biens : qui en profite vraiment ? les plus vulnérables sont-ils inclus ?","Alerte principale : opacité, biais, injustice silencieuse, dépendance ou coût écologique (§101) ?"]}},{"t":"Jeu — « Opportunité ou mirage ? »","d":"Quinze usages : bénéfice authentique, simple surcroît de puissance, ou bénéfice sous conditions ?","kind":"vote","data":{"consigne":"Pour chaque usage, tranchez : bénéfice authentique, « plus de puissance » sans réel mieux, ou bénéfice seulement conditionnel ? La justification est obligatoire.","debat":true,"debatConsigne":"Justifiez chaque choix en une phrase, en vous appuyant sur §93 (« plus puissant ne signifie pas nécessairement meilleur ») et §100.","options":[{"label":"Bénéfice authentique"},{"label":"Plus de puissance sans mieux"},{"label":"Bénéfice conditionnel"}],"items":[{"s":"Une IA aide à détecter plus tôt une tumeur sur une imagerie médicale, le médecin gardant la décision finale.","ok":0},{"s":"Un établissement achète « le modèle le plus puissant du marché » pour le prestige, sans usage pédagogique défini.","ok":1},{"s":"Une IA personnalise les exercices de chaque élève — à condition que l'enseignant garde la main sur la progression.","ok":2},{"s":"Une synthèse vocale lit les manuels à voix haute pour un élève malvoyant.","ok":0},{"s":"Une IA générative rédige les dissertations à la place des élèves, qui n'apprennent plus.","ok":1},{"s":"Un diagnostic assisté par IA déployé en zone rurale — à condition que les données locales soient représentatives et non biaisées.","ok":2},{"s":"Une IA traduit en direct les consignes pour un élève allophone récemment arrivé.","ok":0},{"s":"Un agent conversationnel simule l'amitié pour tenir compagnie à un adolescent isolé, en remplacement des liens réels.","ok":1},{"s":"Une IA d'aide administrative répond aux citoyens — à condition qu'un agent humain reste joignable pour les recours.","ok":2},{"s":"Un modèle prévoit les zones à risque d'inondation pour organiser l'évacuation à temps.","ok":0},{"s":"Une école multiplie des tableaux de bord automatisés que personne ne lit ni n'exploite.","ok":1},{"s":"Un usage massif d'IA générative en classe — à condition de mesurer et de limiter son empreinte en énergie et en eau (§101).","ok":2},{"s":"Une IA soulage une équipe d'un tri documentaire répétitif et pénible, libérant du temps pour la relation.","ok":0},{"s":"Une administration installe un tri des dossiers plus rapide, mais sans voie de recours ni transparence.","ok":1},{"s":"Un outil recommande une orientation scolaire — à condition qu'il n'enferme pas l'élève dans un profil et reste explicable.","ok":2}]}},{"t":"Atelier « Bilan écologique » (30 min)","d":"Chiffrez le coût caché d'une IA générative massive, puis engagez une mesure de sobriété.","kind":"atelier","data":{"consigne":"Estimez qualitativement le coût d'un usage massif d'IA générative dans votre établissement (§101), puis proposez UNE pratique de sobriété réaliste. La création est un don à cultiver ET à garder (Gn 2, 15).","placeholder":"Usage massif visé : … / Coûts estimés (énergie, eau, CO₂, matériel) : … / Notre mesure de sobriété : …","criteres":["Usage visé : quel usage d'IA générative deviendrait massif chez vous (requêtes des élèves, génération d'images, corrections automatiques) ?","Énergie & eau : quel ordre de grandeur pour les centres de données sollicités (§101) ?","Émissions de CO₂ et infrastructures énergivores : quel impact sur la sauvegarde de la Maison commune (§101) ?","Empreinte matérielle : équipements, renouvellement, déchets électroniques.","Mesure de sobriété : mutualiser les requêtes, ne lancer que des requêtes vraiment utiles, choisir un modèle adapté (pas le plus gros).","Règle directrice : « plus puissant ne signifie pas nécessairement meilleur » (§93) — la sobriété comme soin de la création."]}},{"t":"H5P — Course Presentation","d":"Trois vigilances de l'usage personnel, une question de contrôle pour chacune (§100).","kind":"qcm","data":{"consigne":"Parcourez « Les 3 vigilances de l'usage personnel » (§100). Une question de contrôle valide chaque étape.","questions":[{"q":"Première vigilance — la facilité d'obtenir un résultat. Quel est le risque principal quand l'IA livre une réponse toute faite en un instant ?","o":[["On se prive du chemin — effort, recherche, jugement — par lequel on apprend et on discerne.",1],["Le résultat est toujours faux et doit être entièrement refait à la main.",0],["La réponse arrive trop lentement pour être utile en classe.",0],["La facilité est un pur progrès, sans aucune contrepartie.",0]],"fb":"§93 et §100 : « plus facile » n'est pas « meilleur » ; obtenir vite le résultat peut court-circuiter l'effort qui forme la personne."},{"q":"Deuxième vigilance — l'impression d'objectivité. Pourquoi se méfier d'une réponse d'IA qui « paraît neutre » ?","o":[["Elle reflète en réalité les données d'entraînement et les paramètres culturels de ses concepteurs.",1],["Une IA ne peut jamais formuler une phrase correcte.",0],["L'objectivité est en soi un défaut moral.",0],["Les IA refusent systématiquement de répondre aux questions sensibles.",0]],"fb":"§100 : l'apparente objectivité masque les biais des données et des concepteurs — aucune réponse n'est « vue de nulle part »."},{"q":"Troisième vigilance — la simulation de la communication humaine. Que faut-il garder à l'esprit face à un agent qui « semble comprendre » ?","o":[["Il imite le dialogue sans conscience ni intériorité : la relation reste à construire entre personnes.",1],["Il éprouve réellement de l'empathie pour son interlocuteur.",0],["Il possède une conscience morale qui juge le bien et le mal.",0],["Il remplace avantageusement les liens humains pour les personnes isolées.",0]],"fb":"§99-100 : l'IA simule la communication mais n'a ni conscience ni intériorité ; confondre simulation et relation appauvrit le lien réel."}]}}],"M3":[{"t":"Escape game — « La décision opaque » (45 min)","d":"Un élève est refusé par un tri automatique : reconstituez la chaîne des responsabilités et la voie de recours.","kind":"classer","data":{"consigne":"Un élève est refusé par un système de tri automatique, « sans que personne n'assume plus le poids de cette décision » (§103). Énigme après énigme, placez chaque devoir sous le bon maillon de la chaîne. Une fois la chaîne reconstituée, rédigez la voie de recours (charte de contestabilité).","colonnes":["Concepteur","Fournisseur","Établissement","Utilisateur"],"items":[{"s":"Choisir les données d'entraînement et les critères de tri encodés dans le modèle (§111).","col":0},{"s":"Assumer que chaque choix de conception « exprime une vision de l'humanité » (§111).","col":0},{"s":"Rendre le fonctionnement auditable plutôt qu'opaque, pour qu'on puisse le motiver (§105).","col":0},{"s":"Garantir la traçabilité afin qu'une décision puisse être reconstituée et motivée (§105).","col":1},{"s":"Livrer un outil « discutable » et non verrouillé dans un monopole (§110).","col":1},{"s":"Informer du critère de sélection réellement appliqué et assurer la maintenance du système.","col":1},{"s":"Désigner un humain qui assume et rend compte de la décision (§103, §105).","col":2},{"s":"Ouvrir une voie de recours accessible à l'élève refusé, et devant qui protester (§103).","col":2},{"s":"Vérifier l'outil et informer les familles avant de l'adopter.","col":2},{"s":"Ne pas déléguer aveuglément son jugement à la machine, réputée « neutre » à tort (§104).","col":3},{"s":"Contester une décision qui paraît injuste plutôt que la subir en silence (§103).","col":3},{"s":"Signaler un biais ou un dysfonctionnement constaté à l'usage.","col":3}]}},{"t":"Débat structuré (world café, 40 min)","d":"Motion à trancher : faut-il ralentir l'adoption de l'IA à l'école ? (§106)","kind":"vote","data":{"consigne":"Motion : « Faut-il ralentir l'adoption de l'IA à l'école ? » En appui sur §106 : appeler à un ralentissement (cadres juridiques, surveillance indépendante, éducation des utilisateurs, politique qui n'abdique pas) « n'est pas être contre le progrès ». Pour chaque argument entendu au café, décidez s'il est fidèle à l'encyclique ou s'il en fait un contresens.","options":[{"label":"Conforme à l'encyclique (§106)"},{"label":"Contresens à écarter"}],"debat":true,"debatConsigne":"En world café, justifiez chaque position en une phrase, puis rangez l'argument : fidèle au §106 ou contresens à écarter.","items":[{"s":"Ralentir donne le temps de bâtir des cadres juridiques et une surveillance indépendante.","ok":0},{"s":"Ralentir, c'est être contre le progrès et vouloir revenir en arrière.","ok":1},{"s":"Prendre le temps d'éduquer les utilisateurs fait partie d'une adoption responsable.","ok":0},{"s":"Une politique qui « n'abdique pas » peut légitimement réguler le rythme de l'adoption.","ok":0},{"s":"Toute prudence n'est qu'une peur irrationnelle de la technologie.","ok":1},{"s":"Adopter parce que les écoles voisines l'ont déjà fait suffit à décider.","ok":1},{"s":"Ralentir met le progrès au service de la personne, et non l'inverse.","ok":0},{"s":"Déployons d'abord, on pensera aux garde-fous plus tard.","ok":1},{"s":"Un moratoire raisonné laisse le temps de rendre l'usage contestable (§110).","ok":0},{"s":"Ralentir revient purement et simplement à interdire l'IA.","ok":1},{"s":"Réguler le rythme protège d'abord les élèves les plus vulnérables.","ok":0},{"s":"L'école doit courir après la rapidité du monde numérique.","ok":1}]}},{"t":"Atelier « Désarmer » (30 min)","d":"Traduisez « désarmer l'IA » (§110) en quatre gestes pour l'établissement.","kind":"atelier","data":{"consigne":"« Désarmer » l'IA ne signifie pas renoncer à la technologie, mais l'empêcher de dominer l'humain : la soustraire aux monopoles et la rendre « discutable, contestable, et donc habitable » (§110). Traduisez ce mot en 4 gestes concrets pour votre établissement. Pour chacun : une action, un responsable, un signe de réussite.","placeholder":"Nos 4 gestes pour désarmer l'IA…","criteres":["Discutable : où et comment l'usage de l'IA sera-t-il régulièrement mis en débat dans l'établissement ?","Contestable : quelle voie de recours claire ouvrir face à une décision de l'IA (§103, §105) ?","Accessible : comment éviter que l'outil ne profite qu'à « ceux qui disposent déjà des ressources » et des données (§108) ?","Sobre : quelle règle de sobriété et d'attention adopter, sachant qu'une civilisation se mesure « à l'attention qu'elle sait offrir » (§114) ?"]}},{"t":"H5P — Branching « Je conçois, donc je choisis »","d":"Vous concevez un outil scolaire : chaque choix révèle une vision de l'humanité (§111).","kind":"qcm","data":{"consigne":"Vous êtes le concepteur d'un outil d'IA qui trie les inscriptions. À chaque embranchement, votre choix de conception « exprime une vision de l'humanité » (§111). Choisissez la voie qui respecte la dignité de la personne.","questions":[{"q":"Sur quels critères entraînez-vous l'outil de tri ?","o":[["Des critères explicites, documentés et révisables par l'établissement.",1],["Le maximum de données personnelles, « pour plus de précision ».",0],["Les décisions passées, sans vérifier les biais qu'elles reproduisent.",0]],"fb":"Un dispositif « mesure », « ignore » et « classe » (§104) : rendre ses critères explicites, c'est refuser l'injustice silencieuse."},{"q":"Un élève est refusé. Que montre votre interface ?","o":[["Un motif compréhensible et une voie de recours accessible.",1],["Un message « décision définitive », sans aucune explication.",0],["Rien : l'algorithme est présumé neutre et objectif.",0]],"fb":"§103 : l'exclusion « revêtue de neutralité » contre laquelle « il est impossible de protester » est une injustice silencieuse ; §105 exige de pouvoir motiver et réparer."},{"q":"Le fournisseur propose une « boîte noire » plus performante mais inauditable. Vous…","o":[["Refusez : sans transparence, la décision n'est pas contestable (§105, §110).",1],["Acceptez : la performance doit primer sur le reste.",0],["Acceptez, en n'en informant pas les familles.",0]],"fb":"§110 : rendre l'IA « discutable, contestable, et donc habitable » ; une décision non reconstituable (opacité) ne peut être justement contestée."},{"q":"Où placez-vous la responsabilité de la décision finale ?","o":[["Un humain identifié l'assume, peut la motiver et la réparer (§105).",1],["Personne : « c'est l'algorithme qui a décidé ».",0],["Sur l'élève, qui « n'avait qu'à » mieux candidater.",0]],"fb":"§103 dénonce la décision « sans que personne n'assume plus le poids » ; « chacun portera sa propre charge » (Ga 6,5) : la responsabilité doit rester identifiable."}]}}],"M4":[{"t":"Atelier phare (90 min, pairs)","d":"Par binômes, bâtissez une mini-séquence qui apprend aussi à se passer de l'IA à bon escient.","kind":"atelier","data":{"consigne":"Concevez une mini-séquence pédagogique « IA & discernement » pour votre niveau. Le cœur du geste (§140) : apprendre à utiliser l'IA, c'est aussi apprendre à décider quand et pourquoi ne pas l'utiliser. Rédigez chaque rubrique, puis échangez votre fiche avec un autre binôme pour une évaluation croisée.","placeholder":"Objectif visé ; activité AVEC IA ; activité SANS IA (jeûne délibéré) ; critère de discernement remis à l'élève ; modalité d'évaluation intègre…","criteres":["Un objectif d'apprentissage unique et vérifiable","Une activité AVEC IA : quel gain réel (personnalisation, remédiation, accessibilité) et sous quelle responsabilité humaine ?","Une activité SANS IA délibérée : silence, lecture lente, débat où l'on « frotte » les concepts comme du silex jusqu'à l'étincelle de la compréhension (§140)","Un critère de discernement formulé POUR l'élève : « quand et pourquoi ne pas utiliser l'IA ? » (§140)","Une modalité d'évaluation intègre, difficile à sous-traiter à la machine","Un temps d'« hygiène de l'attention » / hors-écran intégré à la séance (§146-147)"]}},{"t":"Jeu de plateau — « L'alliance éducative »","d":"Quatre acteurs autour du plateau : ne tranchez chaque dilemme qu'en les associant tous les quatre.","kind":"atelier","data":{"consigne":"Jeu de plateau de l'« alliance éducative » (§142). Répartissez les quatre pions — École, Famille, Autorité publique, Élève. Pour chaque dilemme tiré, vous ne gagnez une « pierre » (Ne, §8) que si votre décision associe réellement les quatre acteurs : qui écoute, qui décide, qui protège, qui accompagne ? Notez, pour chaque case, la part confiée à chacun.","placeholder":"Dilemme choisi ; ce que fait l'École ; ce que fait la Famille ; ce que fixe l'Autorité publique ; ce que l'Élève apprend à décider…","criteres":["Limite d'âge du smartphone : rôle de la loi (limites d'âge, responsabilisation des fournisseurs, §142), de la famille, de l'école et de l'élève","IA pour les devoirs : où passe la ligne entre aide véritable et sous-traitance du jugement ? (§140)","Contenus nocifs (violence, pornographie, cyberharcèlement, prédation en ligne, §141) : qui protège, qui signale, qui éduque ?","Chaque décision associe bien les QUATRE acteurs — aucun n'est laissé seul (§142)","La solution « reconstruit Jérusalem » : responsabilité partagée, non une règle imposée d'en haut (§8)"]}},{"t":"H5P Branching — « La classe hyperstimulée »","d":"Vous entrez dans une classe gagnée par l'immédiateté : chaque choix agit sur l'attention et la relation.","kind":"qcm","data":{"consigne":"Vous prenez en main une classe marquée par l'immédiateté et l'hyperstimulation (§139). À chaque étape, choisissez le geste qui protège l'attention et la relation, pour aboutir à un protocole d'« hygiène de l'attention » (§146).","questions":[{"q":"Les élèves décrochent en quelques minutes et réclament « du concret, tout de suite ». Quel premier geste construit une hygiène de l'attention ?","o":[["Ouvrir la séance par un temps hors-écran : lecture lente et silence avant toute recherche.",1],["Enchaîner des vidéos courtes et des quiz rapides pour suivre leur rythme.",0],["Leur faire résumer le cours par une IA pour gagner du temps.",0],["Accélérer le débit pour ne pas les « perdre ».",0]],"fb":"§146-147 : l'école n'a pas à courir après la rapidité du numérique ; elle offre du temps partagé et un rythme qui rend l'attention possible."},{"q":"Devant une question difficile, un élève veut la réponse immédiate d'un chatbot. Que proposez-vous ?","o":[["Différer l'IA : faire « frotter » les idées en débat, comme du silex, jusqu'à l'étincelle de la compréhension (§140).",1],["Laisser l'IA répondre : la réponse immédiate vaut mieux que l'effort.",0],["Interdire définitivement tout usage du numérique en classe.",0],["Donner vous-même la réponse pour couper court.",0]],"fb":"§140 : la réponse immédiate risque d'éteindre le désir de poser des questions ; éduquer à l'IA, c'est aussi éduquer à « jeûner » d'elle."},{"q":"Deux élèves se replient sur leurs écrans et évitent le groupe. Quel choix travaille la relation ?","o":[["Aménager un temps de travail partagé, en confiance, qui ne peut pas se faire seul face à un écran (§147).",1],["Les laisser sur écran tant qu'ils « produisent » quelque chose.",0],["Les mettre en compétition pour la meilleure performance individuelle.",0],["Multiplier les notifications pour recapter leur attention.",0]],"fb":"§147 : offrir « ce que le numérique seul ne peut donner : du temps partagé pour apprendre et des relations de confiance »."},{"q":"En fin de parcours, comment stabilisez-vous le protocole d'« hygiène de l'attention » ?","o":[["Instaurer des rituels durables : plages hors-écran, silence, lenteur choisie, moments de « jeûne de l'IA » (§140, §146).",1],["Supprimer purement et simplement tout outil numérique de l'établissement.",0],["Confier le suivi de l'attention à une application de surveillance.",0],["Mesurer chaque élève à son temps d'écran et le classer.",0]],"fb":"§146 : promouvoir une hygiène de l'attention, non une surveillance ; le but est la profondeur, pas le contrôle."}]}},{"t":"Kahoot! — « Sagesse ou information ? »","d":"Situez chaque énoncé sur l'échelle du savoir et repérez où l'IA aide, et où elle ne peut suppléer.","kind":"classer","data":{"consigne":"Placez chaque énoncé sur l'échelle du savoir : donnée → information → connaissance → sagesse. L'IA excelle surtout en bas de l'échelle (données, information) ; elle ne mûrit ni la connaissance ni la sagesse, cet « horizon relationnel et spirituel dans lequel l'humain devient sage » (§146, §99).","colonnes":["Donnée","Information","Connaissance","Sagesse"],"items":[{"s":"« 37,2 » affiché par un capteur, brut, sans aucun contexte.","col":0},{"s":"« La température de l'élève est de 37,2 °C ce matin. »","col":1},{"s":"Comprendre pourquoi la fièvre monte et la relier à d'autres signes cliniques.","col":2},{"s":"Discerner avec tact s'il faut prévenir la famille et rassurer l'enfant inquiet.","col":3},{"s":"Une colonne de chiffres d'absences exportée d'un logiciel de vie scolaire.","col":0},{"s":"« Le taux d'absentéisme de la classe est de 12 % ce trimestre. »","col":1},{"s":"Savoir distinguer les causes d'absence durables des causes passagères.","col":2},{"s":"Accompagner un élève fragile, au bon moment, sans jamais le stigmatiser.","col":3},{"s":"Les mots d'une copie, comptés et vectorisés par un modèle de langage.","col":0},{"s":"Un résumé automatique du texte, exact mais dépourvu de tout jugement.","col":1},{"s":"Relier ce texte à son auteur, à son époque et à d'autres œuvres.","col":2},{"s":"Aimer la vérité que le texte cherche et se laisser transformer par elle (§143).","col":3}]}}],"M5":[{"t":"Enquête « La chaîne invisible » (60 min)","d":"Choisissez un usage banal d'IA et remontez la chaîne humaine et matérielle réelle qui se cache derrière — car « rien n'est immatériel ou magique » (§173).","kind":"atelier","data":{"consigne":"Prenez un usage d'IA du quotidien de l'établissement (chatbot d'aide, correcteur orthographique, générateur d'images, moteur de recommandation) et cartographiez sa « chaîne invisible ». L'encyclique rappelle que « rien, dans le monde de l'IA, n'est immatériel ou magique » (§173) : derrière chaque requête, il y a des humains sous-payés, de l'énergie, des minerais. Restituez sous forme d'infographie (Padlet / base de données Moodle).","placeholder":"Notre chaîne invisible : usage choisi, puis maillon par maillon…","criteres":["Données étiquetées : qui annote les jeux de données, où, à quel salaire ? (le « travail du clic », §173)","Énergie : électricité et eau consommées par l'entraînement et les centres de données","Minerais : terres rares et extraction minière dangereuse, parfois avec des enfants (§173)","Modération de contenus : qui filtre les contenus violents ou traumatisants pour « nettoyer » le service ?","Où, le long de cette chaîne, la dignité de la personne est-elle menacée (subordination mondiale, §173) ?","Un geste concret pour l'établissement : achat plus sobre, choix de fournisseur, sensibilisation des élèves"]}},{"t":"Jeu de rôle « Le conseil d'établissement » (45 min)","d":"Faut-il adopter un outil d'IA de « suivi » des élèves ? Cinq rôles confrontent l'efficacité promise et le risque de contrôle social (§171).","kind":"atelier","data":{"consigne":"Simulez un conseil d'établissement appelé à décider de l'adoption d'un outil d'IA de « suivi » des élèves (présence, comportement, alertes prédictives). Répartissez les rôles — direction, enseignant, parent, délégué élève, DPO (délégué à la protection des données) — et faites-les argumenter. L'enjeu : peser l'efficacité annoncée face au §171, où le contrôle social par les données « profile, prévoit et oriente les comportements » et menace la liberté.","placeholder":"Position de chaque rôle, arguments, puis décision du conseil et ses conditions…","criteres":["Efficacité revendiquée par la direction / l'éditeur (gain de temps, sécurité, décrochage)","Risque de profilage et de discrimination algorithmique : la personne réduite à un « profil » (§171, §164)","Atteinte à la liberté et à la confiance : élèves surveillés, autocensure, climat de suspicion","Voix du délégué élève et du parent : consentement, information, respect de la vie privée","Garanties du DPO : minimisation des données, transparence, voie de recours, durée de conservation","Décision finale du conseil : adopter, refuser ou encadrer — et sous quelles conditions explicites"]}},{"t":"H5P — Dialog Cards « Liberté intérieure »","d":"Retournez chaque carte : une habitude de sobriété numérique au recto, l'enjeu de liberté qu'elle protège au verso (§170).","kind":"flashcards","data":{"consigne":"L'économie de l'attention est conçue pour « capter le temps et le regard » en exploitant nos fragilités (§170). Retournez chaque carte pour découvrir l'enjeu de liberté intérieure que protège une habitude de sobriété.","cartes":[{"recto":"Couper les notifications non essentielles","verso":"Reprendre la maîtrise de son attention au lieu d'être « capté » à la demande des applications (§170)."},{"recto":"Fixer un temps d'écran quotidien et s'y tenir","verso":"Choisir son usage plutôt que le subir : la liberté suppose des bornes conscientes (§170)."},{"recto":"Un « jeûne » numérique hebdomadaire (un jour sans IA ni écran)","verso":"Retrouver le sens du repos et de la gratuité : écho du sabbat, « le repos comme liberté » (Ex 20, 8-10)."},{"recto":"Désactiver le défilement infini et la lecture automatique","verso":"Déjouer les mécanismes conçus pour exploiter nos fragilités et prolonger l'accroche (§170)."},{"recto":"Ne pas consulter son téléphone au réveil ni pendant les repas","verso":"Préserver des temps sans capture de l'attention, pour la présence aux autres et à soi (§170)."},{"recto":"Préférer la lecture lente et le silence à l'hyperconnexion","verso":"Cultiver une intériorité que l'économie de l'attention cherche à dissoudre (§170)."},{"recto":"Se demander : « Ai-je choisi cet usage, ou l'ai-je subi ? »","verso":"Faire de la liberté intérieure un critère de discernement quotidien face à la dépendance (§170)."},{"recto":"Aménager des plages sans smartphone (nuit, repas en famille)","verso":"Protéger les relations et les plus jeunes du glissement vers la dépendance (§170)."}]}},{"t":"Atelier « Charte d'achat responsable »","d":"Traduisez le §179 — due diligence et transparence des filières — en critères concrets d'acquisition des outils numériques de l'établissement.","kind":"atelier","data":{"consigne":"Le §179 appelle à la transparence des filières et à une véritable due diligence (devoir de vigilance) sur ce que l'on achète. Rédigez une « charte d'achat/usage numérique responsable » : une grille de critères qu'un outil d'IA doit satisfaire avant d'être acquis par l'établissement. Ce livrable sera intégré à la charte finale (Module 7).","placeholder":"Nos critères d'achat responsable : un critère par ligne, avec le seuil ou la question de contrôle…","criteres":["Due diligence du fournisseur : conditions de travail dans la chaîne (étiquetage, modération) documentées (§179)","Transparence des filières : origine des données, des minerais et de l'énergie mobilisés (§173, §179)","Sobriété : consommation énergétique et pertinence réelle de l'outil (n'acheter que l'utile)","Protection des élèves : minimisation et propriété des données, pas de colonialisme des données (§178)","Liberté et non-surveillance : pas de profilage ni de contrôle social caché (§171)","Voie de recours et réversibilité : transparence, contrôle humain, possibilité de sortir de l'outil (§105, §179)"]}}],"M6":[{"t":"Atelier « Désarmer les mots » (40 min)","d":"Repérez les ressorts de peur dans des messages réels, puis réécrivez-les en « langage évangélique ».","kind":"atelier","data":{"consigne":"Choisissez un message réel qui circule (post de réseau social, titre de presse, message de groupe). Démontez d'abord sa « fabrication de peurs » (§206), puis réécrivez-le pour dire le vrai sans attiser la haine, dans le « langage évangélique » (§14) : vérité vérifiable, espérance, respect de l'adversaire.","placeholder":"Message d'origine :\n…\n\nProcédés de peur repérés :\n…\n\nRéécriture en langage évangélique :\n…","criteres":["Citer le message d'origine (source et contexte).","Nommer au moins 3 procédés de « fabrication de peurs » (§206) : ennemi désigné / bouc émissaire, dramatisation et exagération de la menace, urgence imposée (« il faut agir maintenant »), généralisation (« tous les… »), chiffres sortis de leur contexte, logique « eux contre nous ».","Conserver l'information légitime : ne pas censurer le fait, seulement désarmer sa charge de peur.","Réécrire en « langage évangélique » (§14) : dire le vrai, ouvrir une espérance, respecter l'adversaire, appeler au dialogue plutôt qu'au mépris.","Vérifier la réécriture avec Rm 12, 21 : « sois vainqueur du mal par le bien »."]}},{"t":"Débat « Peut-on confier une décision létale à une machine ? »","d":"Douze arguments du débat : votez le camp que chacun défend, puis réfutez-en un avec les trois critères du §199.","kind":"vote","data":{"consigne":"Le débat est structuré par les trois critères du §199 : responsabilité personnelle, délai du jugement moral, protection des civils. Pour chaque argument entendu, votez le camp qu'il défend.","options":[{"label":"Non — réservé à l'humain"},{"label":"Oui — délégable à la machine"}],"debat":true,"debatConsigne":"Choisissez un argument « Oui » et réfutez-le en une phrase à l'aide d'un des trois critères du §199.","items":[{"s":"« Aucun algorithme n'est capable de rendre la guerre moralement acceptable » (§198).","ok":0},{"s":"« La rapidité de la machine doit primer : l'humain est trop lent pour la guerre moderne. »","ok":1},{"s":"« La chaîne des responsabilités doit toujours rester identifiable » (§199).","ok":0},{"s":"« Déléguer le tir épargne nos soldats : c'est donc un progrès moral. »","ok":1},{"s":"« Le jugement moral exige un délai que la machine supprime » (§199).","ok":0},{"s":"« Une IA trie les cibles mieux qu'un soldat fatigué et émotif. »","ok":1},{"s":"« La machine ne garantit pas la distinction entre combattants et non-combattants » (§199).","ok":0},{"s":"« La décision de force létale doit rester sous contrôle humain effectif » (§200).","ok":0},{"s":"« La guerre est de toute façon inévitable, autant l'automatiser. »","ok":1},{"s":"« Sans opérateur responsable, plus aucune traçabilité des décisions » (§200).","ok":0},{"s":"« Réduire les victimes à de simples données optimise l'efficacité des frappes. »","ok":1},{"s":"« La paix est le fruit, toujours possible, de la justice et de la charité » (§205).","ok":0}]}},{"t":"Jeu — « Le fil de la responsabilité »","d":"Replacez chaque responsabilité au bon maillon de la chaîne « planifie → forme → autorise → utilise » (§199).","kind":"classer","data":{"consigne":"Reconstituez la chaîne des responsabilités du §199. Placez chaque geste au maillon où le contrôle humain doit rester effectif : rien ne doit tomber dans l'automatisme.","colonnes":["1 · Planifie","2 · Forme","3 · Autorise","4 · Utilise"],"items":[{"s":"Inscrire dès la conception une traçabilité complète des décisions (§200).","col":0},{"s":"Fixer des règles internationales contraignantes avant tout déploiement (§200).","col":0},{"s":"Refuser toute architecture qui rendrait la décision létale autonome (§198).","col":0},{"s":"Entraîner les opérateurs à distinguer combattants et non-combattants (§199).","col":1},{"s":"Apprendre que la rapidité n'est jamais le critère suprême du jugement moral (§199).","col":1},{"s":"Former au droit des conflits et au refus de « réduire les victimes à des données » (§198).","col":1},{"s":"Nommer la personne qui assume la responsabilité de l'engagement (§199).","col":2},{"s":"Maintenir la décision de recourir à la force létale sous autorité humaine (§200).","col":2},{"s":"Garder la chaîne des responsabilités identifiable à chaque échelon (§199).","col":2},{"s":"Exercer sur le tir un contrôle humain effectif, conscient et responsable (§200).","col":3},{"s":"Conserver la capacité d'interrompre l'action à tout instant (§200).","col":3},{"s":"Sur le terrain, refuser de traiter les personnes comme de simples cibles-données (§198).","col":3}]}},{"t":"Production « Micro-projet de paix numérique »","d":"Concevez une action éducative concrète contre la désinformation ou le cyberharcèlement dans votre établissement.","kind":"atelier","data":{"consigne":"Transposez le programme des « artisans de paix » (§210 s.) en un micro-projet réel pour l'école : une action de lutte contre la désinformation (§132-134) ou le cyberharcèlement, intégrable au projet d'établissement.","placeholder":"Titre du projet :\n…\n\nProblème visé et public :\n…\n\nDéroulé de l'action éducative :\n…\n\nIndicateur de réussite :\n…","criteres":["Cibler un besoin précis : désinformation (vérification des sources) ou cyberharcèlement (repérage, recours, réparation).","Nommer le public et les acteurs : élèves, familles, enseignants, en « alliance éducative ».","Décrire une action concrète et sobre (atelier, charte de classe, cellule d'écoute, campagne d'affiches, médiation par les pairs).","Adopter « le regard des victimes » (§210 s.) : donner une voie de recours et de réparation.","Relier le projet à une référence : Mt 5, 9 (« Heureux les artisans de paix ») ou Ps 85, 11 (« justice et paix s'embrassent »).","Prévoir un indicateur simple de suivi pour évaluer l'action sur un trimestre."]}}],"M7":[{"t":"Atelier certificatif — « Charte + Plan d'action » (120 min)","d":"Fusionnez les livrables des modules précédents en UN seul document d'établissement : la Charte « IA & dignité » et son plan d'action.","kind":"atelier","data":{"consigne":"En équipe, consolidez en UN document institutionnel les cinq livrables du parcours : la grille DSE d'audit (M1), le mini-cadre de gouvernance (M3), la mini-séquence « quand ne pas utiliser l'IA » (M4), la charte d'achat responsable (M5) et le micro-projet de paix numérique (M6). Ancrez chaque engagement dans la Doctrine sociale et l'encyclique (citez les §), en vous appuyant sur les 7 engagements de l'école catholique (§229-245) et sur la figure du « sage architecte » qui prend garde à la manière dont il bâtit (1 Co 3, 10 ; §236).","placeholder":"Charte « IA & dignité » de notre établissement — préambule (imago Dei, §104), engagements, gouvernance, plan d'action…","criteres":["Préambule : primauté de la personne sur la performance, fondée sur la dignité inaliénable (§104, §114)","Engagement « discernement » : enseigner quand et pourquoi ne pas utiliser l'IA, et l'intégrité intellectuelle (§140) — reprend la séquence M4","Engagement « hygiène de l'attention et sobriété » : temps de silence, lecture lente, débat, « jeûne de l'IA » (§140, §146)","Protection des mineurs : limites d'âge, contenus, cyberharcèlement, données (§141-142)","Inclusion et justice d'accès : combattre la fracture numérique, accueil de tous (§144)","Gouvernance : responsabilité (qui rend compte ?), voie de recours, transparence, due diligence des outils (§105, §179) — reprend le cadre M3 et la charte d'achat M5","Grille d'audit DSE des systèmes d'IA (M1) annexée et adoptée comme outil de décision","Alliance éducative : rôles école + familles + autorités + Église, en synodalité (§142, §147)","Volet paix numérique : action anti-désinformation ou anti-cyberharcèlement intégrée au projet d'établissement (M6)","Plan d'action opérationnel : priorités hiérarchisées, responsables nommés, échéances, indicateurs mesurables"]}},{"t":"Simulation « Présentation aux autorités »","d":"Chaque équipe défend sa charte en 5 minutes devant un jury de pairs qui l'évalue avec la grille certificative.","kind":"atelier","data":{"consigne":"Préparez et jouez le pitch : 5 minutes pour présenter votre Charte « IA & dignité » et son plan d'action aux autorités (direction, tutelle, diocèse). Positionnez l'école catholique en actrice — « non des spectateurs résignés » mais des bâtisseurs qui entrent sur les chantiers de l'histoire (§241). Si vous êtes jury, notez chaque équipe selon la grille ci-dessous (Annexe C, /100) et justifiez votre note en une phrase par critère.","placeholder":"Notre pitch (ou nos notes de jury) : accroche, ancrage doctrinal, mesures phares, faisabilité, réponse aux objections…","criteres":["Ancrage doctrinal (/ function renderActivite(a,mod,i){
  if(Array.isArray(a)) return '<div class="acti"><div class="acti-h"><span class="b">'+(i+1)+'</span> <span>'+esc(a[0])+'</span></div><div class="acti-d">'+esc(a[1])+'</div></div>';
  const id='act_'+mod+'_'+i; const D=a.data||{}; let body='';
  if(a.kind==='clicwords') body=aClicwords(id,D);
  else if(a.kind==='flashcards') body=aFlash(id,D);
  else if(a.kind==='vote') body=aVote(id,D);
  else if(a.kind==='classer') body=aClasser(id,D);
  else if(a.kind==='atelier') body=aAtelier(id,D);
  else if(a.kind==='qcm') body=aQcm(id,D);
  else if(a.kind==='debat') body=aDebat(id,D);
  else if(a.kind==='saisie') body=aSaisie(id,D);
  return '<div class="acti" id="'+id+'"><div class="acti-h"><span class="b">'+(i+1)+'</span> <span>'+esc(a.t)+'</span>'+(body?ttsBtn('acti','Écouter la consigne'):'')+'</div>'+
    (a.d?'<div class="acti-d">'+esc(a.d)+'</div>':'')+(body?'<div class="acti-body">'+body+'</div>':'')+'</div>';
}

// Carrousel générique (vote & flashcards) : les slides portent data-vidx, les points .vdot.
function voteCar(cid,dir,abs){
  const car=document.getElementById(cid); if(!car) return;
  const items=$$('[data-vidx]',car); const tot=items.length; let cur=+car.getAttribute('data-vcur')||0;
  cur=(abs!=null)?abs:Math.max(0,Math.min(tot-1,cur+dir));
  car.setAttribute('data-vcur',cur);
  items.forEach((it,i)=>it.classList.toggle('vshow',i===cur));
  $$('.vdot',car).forEach((d,i)=>d.classList.toggle('on',i===cur));
  const p=$('[data-vnav="prev"]',car),n=$('[data-vnav="next"]',car);
  if(p)p.disabled=(cur===0); if(n)n.disabled=(cur===tot-1);
}

function sanitizeHtml(html){
  const tmp=document.createElement('div'); tmp.innerHTML=String(html==null?'':html);
  tmp.querySelectorAll('script,style,iframe,object,embed,link,meta,img,a,input,button').forEach(n=>n.remove());
  tmp.querySelectorAll('*').forEach(el=>{ Array.prototype.slice.call(el.attributes).forEach(a=>el.removeAttribute(a.name));
    if(!/^(B|I|EM|STRONG|U|UL|OL|LI|BR|P|DIV|SPAN)$/.test(el.tagName)) el.replaceWith.apply(el,el.childNodes.length?Array.prototype.slice.call(el.childNodes):[]); });
  return tmp.innerHTML;
}

document.addEventListener('click',function(e){
  const t=e.target; if(!t.getAttribute) return; const g=n=>t.getAttribute(n); let id;
  if((id=g('data-cwcheck'))){ const box=document.getElementById(id);let ok=0,tot=0,sel=0;
    $$('.cw-w',box).forEach(w=>{const isok=w.getAttribute('data-ok')==='1';const s=w.classList.contains('sel');if(isok)tot++;if(s)sel++;w.classList.remove('good','bad','miss');
      if(s&&isok){w.classList.add('good');ok++;}else if(s&&!isok)w.classList.add('bad');else if(!s&&isok)w.classList.add('miss');});
    const fb=$('[data-fb]',box);fb.className='acti-fb '+(ok===tot&&sel===ok?'good':'bad');fb.textContent=ok+' / '+tot+' verbe(s) trouvé(s)'+(sel>ok?' · '+(sel-ok)+' erreur(s)':''); return; }
  if((id=g('data-cwreset'))){ const box=document.getElementById(id);$$('.cw-w',box).forEach(w=>w.classList.remove('sel','good','bad','miss'));$('[data-fb]',box).textContent=''; return; }
  if(t.matches('[data-fcshow]')){ const c=t.closest('.flash');const v=$('.flash-verso',c);if(v)v.hidden=false;t.style.display='none'; return; }
  if((id=g('data-vnav'))){ voteCar(g('data-car'),id==='next'?1:-1); return; }
  if((id=g('data-vdot'))&&t.classList.contains('vdot')){ voteCar(g('data-car'),0,parseInt(id,10)); return; }
  if(t.classList.contains('vote-opt')){ const item=t.closest('.vote-item');$$('.vote-opt',item).forEach(o=>o.classList.remove('sel','good','bad'));t.classList.add('sel');
    const car=t.closest('.vote-carousel'); if(car){const dot=$('.vdot[data-vdot="'+item.getAttribute('data-vidx')+'"]',car);if(dot)dot.classList.add('voted');}
    const okAttr=t.getAttribute('data-ok');const fb=$('[data-vfb]',item);
    if(okAttr!==''){ if(okAttr==='1'){t.classList.add('good');fb.className='vote-fb good';fb.textContent='✓ Bonne intuition.';}
      else{t.classList.add('bad');fb.className='vote-fb bad';const gd=$$('.vote-opt',item).find(o=>o.getAttribute('data-ok')==='1');if(gd)gd.classList.add('good');fb.textContent='À revoir — la réponse est surlignée.';}
      fb.hidden=false; } return; }
  if((id=g('data-clcheck'))){ const box=document.getElementById(id);let ok=0,tot=0;
    $$('select[data-clsel]',box).forEach(s=>{tot++;const good=s.value!==''&&s.value===s.getAttribute('data-col');s.classList.remove('good','bad');s.classList.add(good?'good':'bad');if(good)ok++;});
    const fb=$('[data-fb]',box);fb.className='acti-fb '+(ok===tot?'good':'bad');fb.textContent=ok+' / '+tot+' bien classé(s)'; return; }
  if((id=g('data-aqcheck'))){ const box=document.getElementById(id);
    $$('.aq',box).forEach(aq=>{const sel=$('input:checked',aq);const ok=!!sel&&sel.getAttribute('data-ok')==='1';
      $$('.opt-row',aq).forEach(r=>{const inp=$('input',r);const v=inp.getAttribute('data-ok')==='1';r.classList.remove('ok','ko','miss');if(inp.checked&&v)r.classList.add('ok');else if(inp.checked&&!v)r.classList.add('ko');else if(!inp.checked&&v)r.classList.add('miss');});
      const fb=$('[data-aqfb]',aq);fb.className='acti-fb '+(ok?'good':'bad');fb.textContent=(ok?'✓ Correct. ':'✗ À revoir. ')+(fb.getAttribute('data-fbtext')||'');}); return; }
  if((id=g('data-edsubmit'))){ const a=document.querySelector('[data-ed="'+id+'"]');LS.set('mag_ed:'+id,a.innerHTML);const fb=t.parentNode.querySelector('[data-fb]');fb.className='acti-fb good';fb.textContent='✓ Enregistré (brouillon local) — présentez-le à votre formateur ou imprimez-le.'; return; }
  if((id=g('data-edprint'))){ const a=document.querySelector('[data-ed="'+id+'"]');const w=window.open('','_blank');if(w){w.document.write('<meta charset=utf-8><title>Ma production</title><body style="font-family:Georgia,serif;max-width:720px;margin:40px auto;line-height:1.6;padding:0 20px">'+a.innerHTML+'</body>');w.document.close();w.focus();w.print();} return; }
  if((id=g('data-debatadd'))){ const box=document.querySelector('[data-debat="'+id+'"]');const area=$('.debat-area',box);const txt=(area.textContent||'').trim();if(!txt)return;const html=sanitizeHtml(area.innerHTML);
    const key='mag_deb:'+id;let arr=[];try{arr=JSON.parse(LS.get(key)||'[]');}catch(e){}arr.push(html);if(arr.length>60)arr=arr.slice(-60);LS.set(key,JSON.stringify(arr));area.innerHTML='';renderDebatList(box,arr); return; }

const TTS={ synth:(typeof window!=='undefined'&&window.speechSynthesis)?window.speechSynthesis:null, btn:null, chunks:[], i:0, state:'idle', keep:null };
try{ if(TTS.synth){ TTS.synth.getVoices(); TTS.synth.onvoiceschanged=function(){}; } }catch(e){}
function ttsBtn(mode,label){ label=label||'Écouter'; return '<button type="button" class="tts" data-tts="'+mode+'" data-lbl="'+esc(label)+'" aria-label="'+esc(label)+' (lecture audio)">🔊 <span>'+esc(label)+'</span></button>'; }
function ttsPickVoice(){ try{ const vs=TTS.synth.getVoices()||[]; return vs.find(v=>/^fr/i.test(v.lang))||vs.find(v=>/fr/i.test(v.lang))||null; }catch(e){ return null; } }
function ttsChunks(text){ const parts=(text||'').replace(/\s+/g,' ').trim().match(/[^.!?…:;]+[.!?…:;]*/g)||[]; const out=[]; let cur=''; for(const p of parts){ if((cur+' '+p).length>230){ if(cur.trim())out.push(cur.trim()); cur=p; } else cur+=' '+p; } if(cur.trim())out.push(cur.trim()); return out.length?out:[(text||'').trim()].filter(Boolean); }
function ttsText(btn){
  const mode=btn.getAttribute('data-tts');
  if(mode==='cours'){ const c=btn.closest('.mbody')&&btn.closest('.mbody').querySelector('.cours'); return c?c.textContent:''; }
  if(mode==='acti'){ const a=btn.closest('.acti'); if(!a)return '';
    const parts=[]; const h=a.querySelector('.acti-h');
    if(h){ const cl=h.cloneNode(true); cl.querySelectorAll('.tts,.b').forEach(function(x){x.remove();}); parts.push(cl.textContent.trim()); }
    ['.acti-d','.acti-consigne'].forEach(function(s){ const e=a.querySelector(s); if(e)parts.push(e.textContent.trim()); });
    return parts.filter(Boolean).join('. '); }
  if(mode==='quiz'){ const q=btn.closest('.mbody')&&btn.closest('.mbody').querySelector('.quiz'); if(!q)return ''; return $$('.q .qn',q).map(e=>e.textContent.trim()).join(' … '); }
  if(mode==='evalcard'){ const c=btn.closest('.eval-card'); if(!c)return ''; const h=c.querySelector('h3'),d=c.querySelector('.desc'); return (h?h.textContent.trim()+'. ':'')+(d?d.textContent.trim():''); }
  return '';
}
function ttsSpeakNext(){
  if(TTS.i>=TTS.chunks.length){ ttsStop(); return; }
  const u=new SpeechSynthesisUtterance(TTS.chunks[TTS.i]);
  u.lang='fr-FR'; u.rate=1; u.pitch=1; const v=ttsPickVoice(); if(v)u.voice=v;
  u.onend=function(){ if(TTS.state==='playing'){ TTS.i++; ttsSpeakNext(); } };
  u.onerror=function(){ if(TTS.state==='playing'){ TTS.i++; ttsSpeakNext(); } };
  try{ TTS.synth.speak(u); }catch(e){ ttsStop(); return; }
  ttsKeepAlive();
}
function ttsKeepAlive(){ clearTimeout(TTS.keep); TTS.keep=setTimeout(function(){ if(TTS.state==='playing'&&TTS.synth.speaking){ try{TTS.synth.pause();TTS.synth.resume();}catch(e){} ttsKeepAlive(); } },9000); }
function ttsStart(btn){
  if(!TTS.synth){ alert('La lecture audio n\'est pas prise en charge par ce navigateur.'); return; }
  const text=ttsText(btn); if(!text||!text.trim())return;
  try{TTS.synth.cancel();}catch(e){} clearTimeout(TTS.keep);
  TTS.btn=btn; TTS.chunks=ttsChunks(text); TTS.i=0; TTS.state='playing'; refreshTtsBtns(); ttsSpeakNext();
}
function ttsStop(){ TTS.state='idle'; TTS.btn=null; clearTimeout(TTS.keep); try{TTS.synth&&TTS.synth.cancel();}catch(e){} refreshTtsBtns(); }
function ttsToggle(btn){
  if(TTS.btn===btn && TTS.state!=='idle'){
    if(TTS.state==='playing'){ try{TTS.synth.pause();}catch(e){} TTS.state='paused'; }
    else { try{TTS.synth.resume();}catch(e){} TTS.state='playing'; ttsKeepAlive(); }
    refreshTtsBtns(); return;
  }
  ttsStart(btn);
}
function refreshTtsBtns(){ $$('.tts').forEach(function(b){ const lbl=b.getAttribute('data-lbl')||'Écouter';
  if(TTS.btn===b&&TTS.state==='playing'){ b.classList.add('on'); b.innerHTML='⏸ <span>Pause</span>'; }
  else if(TTS.btn===b&&TTS.state==='paused'){ b.classList.add('on'); b.innerHTML='▶ <span>Reprendre</span>'; }
  else { b.classList.remove('on'); b.innerHTML='🔊 <span>'+esc(lbl)+'</span>'; }
}); }
document.addEventListener('click',function(e){ const b=e.target.closest&&e.target.closest('.tts'); if(b){ e.preventDefault(); ttsToggle(b); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&TTS.state!=='idle') ttsStop(); });
window.addEventListener('beforeunload',function(){ try{TTS.synth&&TTS.synth.cancel();}catch(e){} });

const EVAL_CFG={
  entrainement:{titre:"Entraînement chronométré",dureeMin:20,feedback:true,rejouable:true,seuil:70},
  examen:{titre:"Examen final chronométré",dureeMin:45,feedback:false,rejouable:false,seuil:70,taille:40}
};
let RUN=null; // état de la session en cours

function evalHome(){
  return '<div class="eval-modes">'+
    '<div class="eval-card"><h3>🏃 Entraînement</h3><div class="desc">Révisez à votre rythme, <b>sous chronomètre</b> (20 min). Rétroaction immédiate après chaque question, corrigé complet, <b>rejouable à volonté</b>. Choisissez tout le parcours ou un module précis.</div>'+ttsBtn('evalcard','Écouter la consigne')+
    '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--muted);display:block;margin-bottom:5px">Portée</label>'+
    '<select id="entScope" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff">'+
    '<option value="all">Tout le parcours (toutes les questions)</option>'+
    MODULES.map(m=>'<option value="'+m.code+'">'+m.code+' — '+esc(m.titre.split(':')[0].split('—')[0].trim())+'</option>').join('')+
    '</select></div>'+
    '<button class="btn primary" data-startEval="entrainement">Démarrer l\'entraînement</button></div>'+
    '<div class="eval-card exam"><h3>🎓 Examen final</h3><div class="desc"><b>40 questions</b> tirées au sort de tout le parcours, <b>compte à rebours de 45 min</b>. Pas de rétroaction avant la remise, <b>une seule tentative</b>. Réussite à <b>≥ 70 %</b> → attestation imprimable (badge « Discernement IA &amp; DSE »).</div>'+ttsBtn('evalcard','Écouter la consigne')+
    '<button class="btn gold" data-startEval="examen">Commencer l\'examen final</button></div></div>'+
    '<div class="central" style="margin-top:18px"><span class="lab">Barème</span>Réussite du parcours : <b>≥ 70 %</b> au test final <b>et</b> livrable institutionnel validé (charte + plan d\'action). Types de questions : QCM, vrai/faux, appariement et textes à trous — toutes auto-corrigées.</div>';
}

function startEval(mode){
  const cfg=EVAL_CFG[mode];
  let pool;
  if(mode==='entrainement'){
    const scope=$('#entScope')?$('#entScope').value:'all';
    pool = scope==='all' ? BANK.slice() : BANK.filter(q=>q.mod===scope);
    pool = shuffle(pool);
  } else {
    pool = shuffle(BANK).slice(0, Math.min(cfg.taille, BANK.length));
  }
  RUN={mode,cfg,questions:pool,idx:0,answers:{},submitted:false,remaining:cfg.dureeMin*60,timer:null,startedAt:null};
  renderRunner();
  RUN.timer=setInterval(tick,1000);
}
function tick(){
  if(!RUN||RUN.submitted) return;
  RUN.remaining--;
  updateTimer();
  if(RUN.remaining<=0){ clearInterval(RUN.timer); submitEval(true); }
}
function updateTimer(){
  const el=$('#evTimer'); if(!el) return;
  el.textContent='⏱ '+fmtT(RUN.remaining);
  el.classList.toggle('warn',RUN.remaining<=300&&RUN.remaining>60);
  el.classList.toggle('danger',RUN.remaining<=60);
}
function saveCurrentAnswer(){
  if(!RUN) return;const q=RUN.questions[RUN.idx];const box=$('#evQ'); if(!box) return;
  if(q.type==='qcm'||q.type==='vf'){const s=$('input:checked',box);RUN.answers[q.id]={v:s?s.value:null};}
  else if(q.type==='trou'){RUN.answers[q.id]={blanks:$$('.trou-in',box).map(i=>i.value)};}
  else if(q.type==='appar'){RUN.answers[q.id]={pairs:$$('select',box).map(s=>s.value)};}
}
function restoreAnswer(){
  const q=RUN.questions[RUN.idx];const a=RUN.answers[q.id];const box=$('#evQ');if(!a||!box)return;
  if(q.type==='qcm'||q.type==='vf'){if(a.v!=null){const inp=$('input[value="'+a.v+'"]',box);if(inp)inp.checked=true;}}
  else if(q.type==='trou'){$$('.trou-in',box).forEach((i,k)=>{if(a.blanks)i.value=a.blanks[k]||'';});}
  else if(q.type==='appar'){$$('select',box).forEach((s,k)=>{if(a.pairs)s.value=a.pairs[k]||'';});}
}
function isAnswered(q){
  const a=RUN.answers[q.id]; if(!a) return false;
  if(q.type==='qcm'||q.type==='vf') return a.v!=null;
  if(q.type==='trou') return (a.blanks||[]).some(x=>String(x||'').trim()!=='');
  if(q.type==='appar') return (a.pairs||[]).some(x=>x!=='');
  return false;
}
function renderRunner(){
  const cfg=RUN.cfg;const q=RUN.questions[RUN.idx];const n=RUN.questions.length;
  const pct=Math.round((RUN.idx)/n*100);
  const host=$('#evalHost');
  host.innerHTML=
    '<div class="runner-top"><div class="meta">'+cfg.titre+' — question '+(RUN.idx+1)+' / '+n+'</div>'+
    '<div class="timerbox" id="evTimer">⏱ '+fmtT(RUN.remaining)+'</div></div>'+
    '<div class="progressbar"><div style="width:'+pct+'%"></div></div>'+
    '<div id="evQ">'+qHTML(q,'ev',{shuffle:true})+'</div>'+
    '<div class="runner-nav"><button class="btn" data-ev="prev"'+(RUN.idx===0?' disabled':'')+'>‹ Précédente</button>'+
    '<div class="dotnav">'+RUN.questions.map((qq,i)=>'<button class="d'+(i===RUN.idx?' cur':'')+(isAnswered(qq)?' ans':'')+'" data-evgo="'+i+'">'+(i+1)+'</button>').join('')+'</div>'+
    (RUN.idx===n-1
      ? '<button class="btn gold" data-ev="submit">Terminer &amp; corriger</button>'
      : '<button class="btn primary" data-ev="next">Suivante ›</button>')+
    '</div>'+
    '<div style="margin-top:12px;text-align:right"><button class="btn sm" data-ev="submit2">Remettre maintenant</button></div>';
  // la question trou : on masque les __ de l'énoncé pour la lisibilité
  const qn=$('#evQ .qn'); if(q.type==='trou'&&qn){ qn.innerHTML=qn.innerHTML.replace(/__/g,'<b style="color:var(--green-d)">____</b>'); }
  restoreAnswer();
  updateTimer();
}
function navTo(i){saveCurrentAnswer();RUN.idx=Math.max(0,Math.min(RUN.questions.length-1,i));renderRunner();}
function submitEval(auto){
  saveCurrentAnswer();
  if(RUN.submitted) return;
  RUN.submitted=true; if(RUN.timer) clearInterval(RUN.timer);
  // corriger
  let good=0;const details=RUN.questions.map(q=>{
    const a=RUN.answers[q.id]||{};let ok=false;
    if(q.type==='qcm'){const i=(a.v==null?-1:parseInt(a.v,10));ok = i>=0 && !!q.o[i] && q.o[i][1]===1;}
    else if(q.type==='vf') ok = a.v!=null && ((a.v==='V')?1:0)===(q.vrai?1:0);
    else if(q.type==='trou') ok=q.sol.every((s,i)=>s.map(norm).indexOf(norm((a.blanks||[])[i]))>=0);
    else if(q.type==='appar') ok=q.sol.every((s,i)=>String(s)===((a.pairs||[])[i]));
    if(ok) good++;
    return {q,ok,a};
  });
  const n=RUN.questions.length;const pct=Math.round(good/n*100);const pass=pct>=RUN.cfg.seuil;
  const usedSec=RUN.cfg.dureeMin*60-RUN.remaining;
  const host=$('#evalHost');
  let h='<div class="result">'+
    '<div class="ring '+(pass?'':'fail')+'" style="--p:'+pct+'"><div class="in"><div style="font-size:30px;font-weight:800;color:'+(pass?'var(--green-d)':'#c0392b')+'">'+pct+'%</div><div style="font-size:11px;color:var(--muted)">'+good+' / '+n+'</div></div></div>'+
    '<div class="verdict '+(pass?'pass':'fail')+'">'+(pass?'Réussite — félicitations !':'Non validé — continuez à réviser')+'</div>'+
    '<p style="color:var(--muted)">'+(auto?'Temps écoulé. ':'')+'Seuil de réussite : '+RUN.cfg.seuil+' %'+(RUN.mode==='examen'?' · Temps utilisé : '+fmtT(usedSec):'')+'</p>';
  if(RUN.mode==='examen'&&pass){
    h+='<div class="central" style="text-align:left;margin-top:6px"><span class="lab">Badge obtenu</span><b>Discernement IA &amp; DSE</b> — attestation de réussite au test final du séminaire <i>Magnifica Humanitas</i>. Pensez à faire valider votre <b>livrable institutionnel</b> (charte + plan d\'action) pour la certification complète.</div>';
  }
  h+='<div style="display:flex;gap:8px;justify-content:center;margin:14px 0"><button class="btn primary" data-ev="review">Voir la correction détaillée</button>'+
     '<button class="btn" data-ev="restart">'+(RUN.mode==='examen'?'Nouvel examen':'Recommencer')+'</button>'+
     '<button class="btn" data-ev="home">Retour</button>'+
     (RUN.mode==='examen'?'<button class="btn gold" onclick="window.print()">🖨 Imprimer l\'attestation</button>':'')+'</div></div>';
  h+='<div id="evReview" style="display:none"></div>';
  host.innerHTML=h;
  RUN._details=details;
}
function showReview(){
  const host=$('#evReview');host.style.display='block';
  host.innerHTML='<h3 class="h3">Correction détaillée</h3><div class="quiz">'+
    RUN._details.map((d,i)=>{
      const q=d.q;let html=qHTML(q,'rv'+i);
      // On construit un conteneur temporaire pour appliquer les réponses + révéler
      return '<div data-review="'+i+'">'+html+'</div>';
    }).join('')+'</div>';
  // remplir + révéler
  RUN._details.forEach((d,i)=>{
    const wrap=$('[data-review="'+i+'"]',host);const qEl=$('.q',wrap);const q=d.q;const a=d.a;
    if(q.type==='qcm'||q.type==='vf'){if(a.v!=null){const inp=$('input[value="'+a.v+'"]',qEl);if(inp)inp.checked=true;}}
    else if(q.type==='trou'){$$('.trou-in',qEl).forEach((inp,k)=>inp.value=(a.blanks||[])[k]||'');
      const qn=$('.qn',qEl);if(qn)qn.innerHTML=qn.innerHTML.replace(/__/g,'<b style="color:var(--green-d)">____</b>');}
    else if(q.type==='appar'){$$('select',qEl).forEach((s,k)=>s.value=(a.pairs||[])[k]||'');}
    gradeQ(qEl,q,true);
    $$('input,select,.trou-in',qEl).forEach(el=>el.setAttribute('disabled','disabled'));
    // solutions pour les trous
    if(q.type==='trou'){const fb=$('[data-fb]',qEl);fb.innerHTML+=' <b>Réponse(s) : '+q.sol.map(s=>s[0]).join(' · ')+'</b>';}
  });
}
document.addEventListener('click',function(e){
  const s=e.target.getAttribute&&e.target.getAttribute('data-startEval');
  if(s){startEval(s);return;}
  const ev=e.target.getAttribute&&e.target.getAttribute('data-ev');
  if(ev==='next') navTo(RUN.idx+1);
  else if(ev==='prev') navTo(RUN.idx-1);
  else if(ev==='submit'||ev==='submit2'){ if(RUN&&(RUN.mode==='entrainement'||confirm('Remettre définitivement votre examen ?'))) submitEval(false); }
  else if(ev==='review') showReview();
  else if(ev==='restart'){ if(RUN){startEval(RUN.mode);} }
  else if(ev==='home'){ RUN=null; $('#evalHost').innerHTML=evalHome(); }
  const go=e.target.getAttribute&&e.target.getAttribute('data-evgo');
  if(go!=null) navTo(parseInt(go,10));
});

  '<tr><td>C3</td><td>Identifier les opportunités et évaluer les conditions d\'un usage juste.</td></tr>'+
  '<tr><td>C4</td><td>Repérer les alertes et mobiliser un critère de discernement adapté.</td></tr>'+
  '<tr><td>C5</td><td>Concevoir des dispositifs éduquant à un usage « responsable, critique et créatif » (§145).</td></tr>'+

// P3 — Cadre pédagogique
PAGES.push({titre:"Cadre pédagogique",html:
  '<h2 class="title">Cadre pédagogique</h2>'+
  '<div class="sec-lab">Principes pédagogiques</div><ul class="check">'+
  '<li><b>Alignement pédagogique</b> (Biggs & Tang) : objectifs → activités → évaluation cohérents.</li>'+
  '<li><b>Taxonomie de Bloom révisée</b> : se souvenir → comprendre → appliquer → analyser → évaluer → créer.</li>'+
  '<li><b>Modèle SAMR</b> pour graduer l\'intégration du numérique, sans « courir après la rapidité » (§147).</li>'+
  '<li><b>Learning by design</b> (Laurillard) : l\'apprenant <i>produit</i> (charte, séquence).</li>'+
  '<li><b>Principe de sobriété</b> (§140, §146) : chaque activité intègre un temps « hors-écran ».</li></ul>'});

// P4..P11 — modules

PAGES.push({titre:"Synthèse transversale",html:

  [['Vie civile / services','Santé, administration, recherche, écologie, inclusion','Injustice silencieuse, opacité, concentration','§9, §99-108'],
   ['Éducation','Personnalisation, accessibilité, remédiation, temps enseignant','Extinction du questionnement, fragmentation, fracture','§140, §144-146'],
   ['Communication / vérité','Débat, participation, accès à l\'information','Désinformation, manipulation','§132-137'],
   ['Travail','Soulager des tâches pénibles, libérer du temps','Déqualification, surveillance, chômage','§148-156'],
   ['Liberté','Outils d\'organisation et de prévention','Économie de l\'attention, dépendances, contrôle social','§170-172'],
   ['Dignité mondiale','—','Esclavage numérique, colonialisme des données','§173-179'],
   ['Paix / sécurité','—','Armes autonomes, abaissement du seuil de la violence','§197-200']].map(r=>'<tr><td>'+esc(r[0])+'</td><td style="font-weight:400;color:var(--green-d)">'+esc(r[1])+'</td><td style="font-weight:400;color:#b9701a">'+esc(r[2])+'</td><td style="font-weight:400;color:var(--muted)">'+esc(r[3])+'</td></tr>').join('')+
  '</tbody></table>'+
  '<div class="sec-lab">Les 7 questions de discernement (mémo de poche)</div><ol class="obj">'+
  ['<b>Personne :</b> cet usage sert-il la dignité de chacun, ou la sacrifie-t-il à l\'efficacité ?',

   '<b>Transparence :</b> peut-on reconstituer et motiver la décision ?',
   '<b>Justice :</b> cet usage réduit-il ou aggrave-t-il les inégalités ?',

PAGES.push({titre:"Évaluation chronométrée",html:
  '<h2 class="title">Évaluation sommative chronométrée</h2>'+
  '<p class="subtitle">Un même dispositif auto-corrigé, sous chronomètre, en deux modes : <b>entraînement</b> (rétroaction immédiate, rejouable) et <b>examen final</b> (compte à rebours, une tentative, attestation).</p>'+
  '<div id="evalHost">'+evalHome()+'</div>'});

  '<div class="sec-lab">Glossaire</div><dl class="gloss">'+
  [['Alliance éducative','Collaboration entre familles, écoles, communautés chrétiennes et institutions publiques pour l\'éducation à l\'ère numérique (§147).'],
   ['Désarmer (l\'IA)','La soustraire aux monopoles et à la logique de compétition pour la rendre discutable, contestable et accessible (§110).'],
   ['Développement humain intégral','Développement de « tout l\'homme et de tout homme » (Populorum progressio ; §82).'],
   ['Hygiène de l\'attention','Rythmes ménageant silence, étude approfondie, lecture et confrontation mesurée (§146).'],
   ['Imago Dei','L\'être humain créé à l\'image de Dieu, fondement de la dignité inaliénable (Gn 1, 26-27).'],

/* ---- Assemblage : UNE seule page (sections + accordéons de modules) ---- */
// PAGES = [0 Présentation, 1 Syllabus, 2 Cadre, 3 Synthèse, 4 Évaluation, 5 Références]
const SEC=[
  {id:'sec-presentation',lib:'Présentation'},
  {id:'sec-syllabus',lib:'Syllabus'},
  {id:'sec-cadre',lib:'Cadre'},
  {id:'sec-synthese',lib:'Synthèse'},
  {id:'sec-evaluation',lib:'Évaluation'},
  {id:'sec-references',lib:'Références'}
];
function subnav(){
  const items=[SEC[0],SEC[1],SEC[2],{id:'sec-modules',lib:'Modules'},SEC[3],SEC[4],SEC[5]];
  return '<nav class="subnav" id="subnav">'+items.map(it=>'<a href="#'+it.id+'">'+esc(it.lib)+'</a>').join('')+'</nav>';
}
function modulesBlock(){
  const chips=MODULES.map(m=>'<button type="button" data-modjump="mod-'+m.deck+'">'+esc(m.code)+'</button>').join('');
  return '<section class="block" id="sec-modules">'+
    '<h2 class="title">Les 8 modules de la formation</h2>'+
    '<p class="subtitle">Chaque module est une <b>section dépliable</b> : cliquez sur son titre pour l\'ouvrir. Il réunit points-clés, objectifs, ancrage, synthèse, activités, exercices auto-corrigés, livrable — et son diaporama (PowerPoint) téléchargeable.</p>'+
    '<div class="modchips">'+chips+'<button type="button" class="tool" data-modall="open">Tout déplier</button><button type="button" class="tool" data-modall="close">Tout replier</button></div>'+
    MODULES.map(moduleAccordion).join('')+
    '</section>';
}

app.innerHTML=
  '<section class="hero" id="'+SEC[0].id+'">'+PAGES[0].html+'</section>'+
  subnav()+
  '<section class="block" id="'+SEC[1].id+'">'+PAGES[1].html+'</section>'+
  '<section class="block" id="'+SEC[2].id+'">'+PAGES[2].html+'</section>'+
  modulesBlock()+
  '<section class="block" id="'+SEC[3].id+'">'+PAGES[3].html+'</section>'+
  '<section class="block" id="'+SEC[4].id+'">'+PAGES[4].html+'</section>'+
  '<section class="block" id="'+SEC[5].id+'">'+PAGES[5].html+'</section>';
initActivites();

// Barre de progression = défilement de la page.
function onScroll(){ const h=document.documentElement; const max=h.scrollHeight-h.clientHeight; $('#rule').style.width=(max>0?Math.min(100,h.scrollTop/max*100):0)+'%'; }
window.addEventListener('scroll',onScroll,{passive:true}); onScroll();

// Accordéons de modules : puces d'accès rapide (ouvrir + défiler) + tout déplier / replier.
document.addEventListener('click',function(e){
  const j=e.target.getAttribute&&e.target.getAttribute('data-modjump');
  if(j){const d=document.getElementById(j); if(d){d.open=true; setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'start'}),40);} return;}
  const all=e.target.getAttribute&&e.target.getAttribute('data-modall');
  if(all){$$('.mod-acc').forEach(d=>{d.open=(all==='open');});}
});
// Plein écran.
$('#fs')&&$('#fs').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen&&document.exitFullscreen();});
</script>
