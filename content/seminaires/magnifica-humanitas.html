<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Préserver l'humain à l'ère de l'IA — Séminaire Magnifica Humanitas</title>
<style>
  :root{
    --forest:#1c543b; --forest-d:#0f3527; --forest-l:#f0f8f3; --green:#1f8a4c; --green-d:#14663a;
    --gold:#b8860b; --gold-d:#8a611c; --cream:#fbfaf6; --line:#e6e6de; --ink:#243027; --muted:#66726a;
    --orange:#e08a1e; --orange-l:#fdf3e3; --slate:#385050;
    --shadow:0 1px 2px rgba(15,53,39,.05), 0 8px 26px rgba(15,53,39,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#eef1ee;line-height:1.62;font-size:15px}
  button,input,textarea,select{font-family:inherit;font-size:15px}
  .serif{font-family:Georgia,'Times New Roman',serif}
  /* Barre supérieure */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .pos{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);min-width:0}
  .topbar .pos .n{font-weight:800;color:var(--green-d)}
  .topbar .pos .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--forest);
    border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .btn:hover:not(:disabled){border-color:var(--green);color:var(--green-d)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--green-d);border-color:var(--green-d);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--green);border-color:var(--green);color:#fff}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn.gold:hover:not(:disabled){background:var(--gold-d);border-color:var(--gold-d);color:#fff}
  .btn.sm{padding:5px 10px;font-size:13px}
  .rule{position:absolute;left:0;bottom:-1px;height:3px;background:var(--green);transition:width .3s;width:0}
  /* Contenu */
  .stage{width:100%;max-width:1440px;margin:0 auto;padding:16px clamp(14px,3vw,40px) 90px}
  /* Confort de lecture : les longs paragraphes gardent une largeur maîtrisée dans un conteneur large */
  .hero .infobox,.block>p,.mod-acc .mbody>p{max-width:120ch}
  .page{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:30px 34px;min-height:60vh}
  .page.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--gold-d);margin:0 0 10px}
  h1.title{font-size:29px;line-height:1.16;color:var(--forest);margin:0 0 8px;font-weight:800}
  .subtitle{font-style:italic;color:var(--muted);margin:0 0 20px}
  h2.title{font-size:23px;color:var(--forest);margin:0 0 16px;font-weight:800;line-height:1.2}
  h3.h3{font-size:16px;color:var(--forest);margin:22px 0 10px;font-weight:700}
  p{margin:0 0 14px}
  a{color:var(--green-d)}
  .sec-lab{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d);margin:24px 0 10px;border-bottom:2px solid var(--forest-l);padding-bottom:6px}
  .infobox{border:1px solid #cfe3d6;background:#f6faf7;border-radius:12px;padding:14px 18px;margin:0 0 20px;color:var(--muted)}
  .infobox .lab{font-weight:700;color:var(--green-d);letter-spacing:.05em;font-size:12.5px;text-transform:uppercase;margin-bottom:6px;display:block}
  .infobox b{color:var(--ink)}
  .central{background:#fdf9ec;border:1px solid #f2e2a8;border-radius:12px;padding:14px 18px;margin:16px 0;font-style:italic;color:#5a4a2a}
  .central .lab{font-style:normal;font-weight:700;letter-spacing:.05em;font-size:12.5px;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px;display:block}
  /* Le cours (narratif développé, d'après le livret) */
  .cours p{font-size:15.5px;line-height:1.7;margin:0 0 13px}
  .cours-h{font-size:16px;font-weight:800;color:var(--forest);margin:20px 0 7px}
  .cours-cite{margin:18px 0;padding:12px 20px;border-left:4px solid var(--gold);background:#fdf9ec;border-radius:0 10px 10px 0;font-style:italic;font-size:16.5px;line-height:1.5;color:#6a5420;font-family:Georgia,'Times New Roman',serif}
  .cours-decisif{margin:18px 0 2px;background:var(--forest-l);border:1px solid #cfe3d6;border-radius:12px;padding:15px 20px}
  .cours-decisif .lab{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d);margin-bottom:7px}
  .cours-decisif p{font-size:15.5px;line-height:1.7;margin:0 0 10px}
  .cours-decisif p:last-child{margin-bottom:0}
  /* Lecteur audio (synthèse vocale) */
  .tts{display:inline-flex;align-items:center;gap:5px;border:1px solid #cfe3d6;background:#fff;color:var(--green-d);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;vertical-align:middle;margin-left:10px;text-transform:none;letter-spacing:normal;transition:.12s;white-space:nowrap}
  .tts:hover{background:var(--forest-l);border-color:var(--green)}
  .tts.on{background:var(--green-d);color:#fff;border-color:var(--green-d)}
  .acti-h .tts{margin-left:8px;padding:2px 9px;font-size:11.5px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 22px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fcfdfc}
  .tile .lab{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .tile .val{font-weight:600;color:var(--forest)}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  ol.obj{margin:0;padding:0;list-style:none;counter-reset:o}
  ol.obj li{position:relative;padding:0 0 12px 34px;counter-increment:o}
  ol.obj li::before{content:counter(o);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;
    background:var(--green-d);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  ul.dot{margin:0 0 8px;padding-left:20px}
  ul.dot li{padding:0 0 6px}
  ul.check{list-style:none;padding:0;margin:0 0 8px}
  ul.check li{position:relative;padding:0 0 8px 24px}
  ul.check li::before{content:"\2713";position:absolute;left:2px;top:0;color:var(--green);font-weight:700}
  table.grid{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14px}
  table.grid th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 11px;border-bottom:2px solid var(--line)}
  table.grid td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
  table.grid td:first-child{font-weight:700;color:var(--forest)}
  .chip{display:inline-block;background:var(--forest-l);color:var(--green-d);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700}
  .badge-mod{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 10px;border-radius:8px;background:var(--forest-d);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em}
  .modhead{display:flex;align-items:center;gap:12px;margin:0 0 4px}
  .opp-alert{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
  .oa{border-radius:12px;padding:14px 16px}
  .oa.opp{background:#eef8f1;border:1px solid #bfe6cd}
  .oa.al{background:var(--orange-l);border:1px solid #f0d3a3}
  .oa .h{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:12.5px;margin-bottom:8px}
  .oa.opp .h{color:var(--green-d)} .oa.al .h{color:#b9701a}
  .oa ul{margin:0;padding-left:18px} .oa li{padding:0 0 5px}
  details.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  details.acc>summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none;font-weight:600;color:var(--forest)}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .b{background:var(--green-d);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px}
  details.acc>summary .chev{margin-left:auto;color:var(--green);transition:.2s}
  details.acc[open]>summary .chev{transform:rotate(180deg)}
  details.acc .body{padding:2px 16px 14px 16px;color:var(--muted)}
  /* Diaporama (deck) */
  .deck{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:6px 0 8px;background:#fff}
  .deck-view{background:linear-gradient(160deg,#0f3527,#1c543b);color:#eaf5ee;min-height:340px;padding:26px 28px;position:relative;display:flex;flex-direction:column}
  .deck-kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8fd3ab;font-weight:700;margin-bottom:8px}
  .deck-title{font-size:22px;font-weight:800;color:#fff;line-height:1.2;margin:0 0 14px}
  .deck-body{font-size:14.5px;line-height:1.55}
  .deck-body ul{margin:0;padding-left:18px} .deck-body li{padding:2px 0}
  .deck-ess{display:grid;gap:12px}
  .deck-ess .it{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start}
  .deck-ess .ic{font-size:24px;line-height:1}
  .deck-ess .tt{font-weight:800;color:#fff} .deck-ess .dd{color:#cfe9d9;font-size:13.5px}
  .deck-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .deck-two .h{font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;margin-bottom:8px;color:#ffd98a}
  .deck-two ul{padding-left:16px}
  .deck-num{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
  .deck-num .it{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start}
  .deck-num .nn{width:24px;height:24px;border-radius:50%;background:#2f7d54;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .deck-qcm .opt{display:flex;gap:8px;padding:4px 0;color:#dcefe3}
  .deck-qcm .opt .mk{color:#8fd3ab;font-weight:800}
  .deck-qcm .opt.ok{color:#fff;font-weight:700}
  .deck-ret{background:rgba(255,255,255,.1);border-left:3px solid #ffd98a;border-radius:0 8px 8px 0;padding:11px 14px;margin-top:10px}
  .deck-ret .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#ffd98a;font-weight:800;margin-bottom:4px}
  .deck-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f4f7f4;border-top:1px solid var(--line)}
  .deck-bar .dots{display:flex;gap:6px}
  .deck-bar .dot{width:8px;height:8px;border-radius:50%;background:#cdd8cf;cursor:pointer}
  .deck-bar .dot.on{background:var(--green-d)}
  .deck-bar .nav{display:flex;gap:6px;align-items:center}
  .deck-count{font-size:12.5px;color:var(--muted);font-weight:600}
  /* Quiz (exercices module + évaluation) */
  .quiz{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:8px 0;background:#fcfdfc}
  .q{padding:12px 0;border-bottom:1px solid var(--line)}
  .q:last-child{border-bottom:none}
  .q .qn{font-weight:700;color:var(--ink);margin:0 0 10px}
  .q .qn .tag{display:inline-block;background:var(--forest-l);color:var(--green-d);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-right:8px;letter-spacing:.03em}
  .opt-row{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin:0 0 7px;cursor:pointer;background:#fff;transition:.12s}
  .opt-row:hover{border-color:var(--green)}
  .opt-row input{margin-top:3px}
  .opt-row.ok{border-color:var(--green-d);background:#eef8f1}
  .opt-row.ko{border-color:#e0a3a3;background:#fbeeee}
  .opt-row.miss{border-color:var(--green-d);background:#f2faf4;border-style:dashed}
  .trou-in{border:1px solid var(--line);border-radius:7px;padding:5px 10px;min-width:120px;outline:none}
  .trou-in:focus{border-color:var(--green)}
  .trou-in.ok{border-color:var(--green-d);background:#eef8f1}
  .trou-in.ko{border-color:#e0a3a3;background:#fbeeee}
  .appar-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:0 0 8px}
  .appar-row .g{font-weight:600}
  .appar-row select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
  .appar-row select.ok{border-color:var(--green-d);background:#eef8f1}
  .appar-row select.ko{border-color:#e0a3a3;background:#fbeeee}
  .fb{border-radius:8px;padding:9px 12px;margin-top:8px;font-size:13.5px;display:none}
  .fb.show{display:block}
  .fb.good{background:#eef8f1;border:1px solid #bfe6cd;color:var(--green-d)}
  .fb.bad{background:#fbeeee;border:1px solid #e6bcbc;color:#a23b3b}
  /* Évaluation */
  .eval-modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0 4px}
  .eval-card{border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column}
  .eval-card h3{margin:0 0 6px;color:var(--forest);font-size:18px}
  .eval-card .desc{color:var(--muted);font-size:13.5px;margin:0 0 14px;flex:1}
  .eval-card.exam{background:#fdf9ec;border-color:#f0e2ad}
  .runner-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:12px 16px;background:var(--forest-l);border-radius:12px}
  .runner-top .meta{font-weight:700;color:var(--forest)}
  .timerbox{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;color:var(--green-d);font-variant-numeric:tabular-nums}
  .timerbox.warn{color:#c0561a;border-color:#f0c79a;background:#fdf3e3}
  .timerbox.danger{color:#fff;background:#c0392b;border-color:#c0392b;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .progressbar{height:7px;background:#e3ece5;border-radius:999px;overflow:hidden;margin:0 0 14px}
  .progressbar>div{height:100%;background:var(--green);transition:width .2s}
  .runner-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .dotnav{display:flex;flex-wrap:wrap;gap:6px}
  .dotnav .d{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .dotnav .d.cur{border-color:var(--green-d);color:var(--green-d)}
  .dotnav .d.ans{background:var(--forest-l);color:var(--green-d);border-color:#bfe6cd}
  .result{text-align:center;padding:14px}
  .result .score{font-size:52px;font-weight:800;line-height:1}
  .result .score.pass{color:var(--green-d)} .result .score.fail{color:#c0392b}
  .result .verdict{font-weight:800;font-size:20px;margin:6px 0}
  .result .verdict.pass{color:var(--green-d)} .result .verdict.fail{color:#c0392b}
  .ring{--p:0;width:130px;height:130px;border-radius:50%;margin:6px auto 10px;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--green) calc(var(--p)*1%), #e3ece5 0)}
  .ring .in{width:104px;height:104px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring.fail{background:conic-gradient(#c0392b calc(var(--p)*1%), #e3ece5 0)}
  /* Sommaire modal */
  .modal{position:fixed;inset:0;background:rgba(15,53,39,.42);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal.open{display:flex}
  .modal .sheet{background:#fff;border-radius:16px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
  .modal .sheet .hd{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;color:var(--forest);display:flex;justify-content:space-between;align-items:center}
  .modal .toc{list-style:none;margin:0;padding:8px}
  .modal .toc li{padding:11px 14px;border-radius:9px;cursor:pointer;display:flex;gap:12px;align-items:center}
  .modal .toc li:hover{background:var(--forest-l)}
  .modal .toc li .idx{color:var(--muted);font-weight:700;min-width:26px;font-variant-numeric:tabular-nums}
  .modal .toc li.cur{background:var(--forest-l);color:var(--green-d);font-weight:700}
  /* Nav bas */
  .botnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
  .botnav .center{color:var(--muted);font-size:13px;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:720px){
    .page{padding:22px 18px}
    .tiles{grid-template-columns:1fr 1fr}
    .cols2,.opp-alert,.eval-modes,.deck-two,.deck-num{grid-template-columns:1fr}
    .appar-row{grid-template-columns:1fr}
    h1.title{font-size:24px}
    .botnav .lbl{display:none}
  }
  .foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:22px}
  .ref-list{margin:0;padding-left:20px} .ref-list li{padding:0 0 9px}
  .gloss dt{font-weight:700;color:var(--forest);margin-top:12px}
  .gloss dd{margin:2px 0 0}
  /* ===== Mise en page « une seule page » + accordéons de modules ===== */
  .stage{padding-bottom:60px}
  .hero{background:linear-gradient(160deg,#0f3527,#1c543b);color:#eef7f0;border-radius:16px;padding:32px 34px;margin:0 0 16px;box-shadow:var(--shadow)}
  .hero .eyebrow{color:#9fd8b7}
  .hero h1.title{color:#fff;font-size:30px;font-weight:800;margin:0 0 8px;line-height:1.14}
  .hero .subtitle{color:#cfe9d9;margin:0 0 18px}
  .hero .infobox{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#dcefe3}
  .hero .infobox .lab{color:#ffd98a}
  .hero .infobox b{color:#fff}
  .hero .tile{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15)}
  .hero .tile .lab{color:#9fd8b7}
  .hero .tile .val{color:#fff}
  .hero .foot{color:#bfe0cd}
  .hero .ppt{background:rgba(255,255,255,.1) !important;border-color:#ffd98a !important;color:#ffe9b8 !important}
  .subnav{position:sticky;top:52px;z-index:15;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:7px;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:5px;box-shadow:0 4px 14px rgba(15,53,39,.05)}
  .subnav a{font-size:13px;font-weight:600;color:var(--forest);text-decoration:none;padding:6px 13px;border-radius:999px;border:1px solid transparent}
  .subnav a:hover{background:var(--forest-l);border-color:#cfe3d6;color:var(--green-d)}
  .block{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;margin:0 0 18px;scroll-margin-top:108px}
  .block>h2.title:first-child{margin-top:0}
  .modchips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}
  .modchips button{font-family:inherit;font-size:13px;font-weight:700;color:var(--green-d);background:var(--forest-l);border:1px solid #cfe3d6;border-radius:999px;padding:6px 13px;cursor:pointer;transition:.12s}
  .modchips button:hover{background:#dbeee2}
  .modchips button.tool{background:#fff;color:var(--muted);border-color:var(--line)}
  .mod-acc{border:1px solid var(--line);border-radius:14px;margin:0 0 12px;background:#fff;overflow:hidden;scroll-margin-top:108px}
  .mod-acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:17px 20px;transition:.12s}
  .mod-acc>summary::-webkit-details-marker{display:none}
  .mod-acc>summary:hover{background:#f7faf8}
  .mod-acc>summary .mt{flex:1;min-width:0}
  .mod-acc>summary .mt .tt{font-weight:800;color:var(--forest);font-size:16.5px;line-height:1.25}
  .mod-acc>summary .mt .mm{font-size:12.5px;color:var(--muted);margin-top:3px}

 {code:"M1",deck:"m1",titre:"Anthropologie chrétienne et IA : la dignité de la personne",ancrage:"Chapitre 2 ; Ch. 3 §97-99",duree:"3 h",
  objectifs:["<b>Comprendre :</b> exposer l'anthropologie de l'<i>imago Dei</i> et l'égale dignité de tous.","<b>Appliquer :</b> distinguer ce que l'IA <i>est</i> et <i>n'est pas</i>.","<b>Analyser :</b> mobiliser les cinq principes de la DSE comme grille de lecture d'un système d'IA."],
  ancrage_html:"<p>L'être humain est image du Dieu trinitaire ; sa dignité est inaliénable (Ch. 2 ; <i>Dignitas infinita</i>). L'IA imite certaines fonctions de l'intelligence humaine et les surpasse en vitesse (§99), mais ces systèmes « ne vivent pas d'expérience, ne possèdent pas de corps, ne connaissent ni la joie ni la douleur… et n'ont pas de conscience morale » (§99). Ils sont « davantage cultivés que construits » ; même leurs concepteurs « en savent peu sur leur fonctionnement réel » (§98).</p><p class='foot' style='text-align:left'><b>Références :</b> Gn 1, 26-27 · Ps 8, 5-7 · Mt 13, 52 · Antiqua et nova (2025) · Dignitas infinita (2024).</p>",
  synthese:"La dignité de la personne n'est pas conférée par ses performances : elle est reçue, inaliénable, fondée sur la création à l'image de Dieu. Cette conviction devient un <b>critère opératoire</b> : un système qui traite certaines vies « comme moins dignes ou les exclut sans possibilité d'appel » introduit « déjà un critère qui contredit la dignité inaliénable de la personne » (§104). L'IA « peut simuler de l'empathie », mais « n'habite pas l'horizon affectif, relationnel et spirituel dans lequel l'humain devient sage » (§99).",
  vigilance:["<b>Anthropomorphisme :</b> attribuer une conscience ou une intériorité à la machine (§99-100).","<b>Réductionnisme :</b> ramener la personne à un « profil » ou à ses données (§164, §171)."],
  activites:[["H5P — Interactive Video (12 min)","« L'IA, ce qu'elle est / ce qu'elle n'est pas » avec 4 questions intégrées."],["Jeu — « Humain ou machine ? »","Classer 16 capacités (souffrir, calculer vite, pardonner, mûrir par ses erreurs…) en deux colonnes."],["Atelier « Grille DSE » (60 min)","Cinq groupes = cinq principes ; chacun formule 3 questions d'audit posées à un système d'IA scolaire."],["Glossaire vivant (Moodle)","Alimenter : imago Dei, dignité, subsidiarité, solidarité, bien commun, développement humain intégral."]],
  livrable:"La grille DSE d'audit d'un système d'IA (5 principes × 3 questions), co-construite et versionnée."},

 {code:"M2",deck:"m2",titre:"Opportunités de l'IA dans la vie civile",ancrage:"Chapitre 3 §90-101",duree:"3 h",
  objectifs:["<b>Comprendre :</b> énoncer les bénéfices potentiels de l'IA pour le développement humain intégral.","<b>Analyser :</b> distinguer un bénéfice réel d'un « plus de puissance » qui n'est pas « un mieux » (§93).","<b>Évaluer :</b> poser les conditions d'un usage civil juste (environnement, objectivité illusoire, relation simulée)."],
  ancrage_html:"<p>« En soi, ces innovations peuvent devenir une aide précieuse pour le développement humain intégral et pour la sauvegarde de notre Maison commune » (§93). Trois vigilances de l'usage personnel : facilité d'obtenir un résultat, impression d'objectivité, simulation de la communication humaine (§100). Alerte sur l'impact environnemental : énergie, eau, émissions de CO₂, centres de données énergivores (§101). « Plus puissant ne signifie pas nécessairement meilleur » (§93).</p><p class='foot' style='text-align:left'><b>Références :</b> Mt 25, 14-30 · Gn 1, 28 · Si 38, 1-8 · Laudato si' (2015) · Antiqua et nova (2025).</p>",
  synthese:"L'encyclique reconnaît des bénéfices concrets : l'IA « peut soigner, relier, éduquer, protéger la Maison commune » (§9) et « soulager l'homme de certains travaux particulièrement pénibles, répétitifs ou dangereux » (§152). Domaines d'opportunité (à évaluer au cas par cas) : santé et diagnostic ; accès au savoir ; services publics ; recherche ; écologie ; inclusion des personnes en situation de handicap ; logistique humanitaire.",
  central:"<b>Règle d'or du module :</b> un usage est une véritable opportunité seulement s'il <b>sert la personne, reste sous responsabilité humaine, et n'aggrave pas les inégalités ni l'empreinte écologique</b>.",
  activites:[["Étude de cas (jigsaw, 60 min)","Quatre cas (santé ; administration ; agriculture/climat ; inclusion) évalués avec la grille DSE du M1."],["Jeu — « Opportunité ou mirage ? »","15 usages : bénéfice authentique, « plus de puissance » sans mieux, ou bénéfice conditionnel ?"],["Atelier « Bilan écologique » (30 min)","Estimer le coût en énergie/eau d'un usage massif d'IA (§101) et proposer une pratique de sobriété."],["H5P — Course Presentation","Parcours « Les 3 vigilances de l'usage personnel » (§100)."]],
  livrable:"Une fiche-opportunité par groupe (usage + bénéfice + condition + alerte + sobriété), consolidée en catalogue raisonné."},

 {code:"M3",deck:"m3",titre:"Alertes et gouvernance : responsabilité, transparence, « désarmer l'IA »",ancrage:"Chapitre 3 §102-114",duree:"3 h",
  objectifs:["<b>Analyser :</b> décomposer la chaîne des responsabilités d'un système d'IA.","<b>Évaluer :</b> juger un cas au regard de la transparence, de la contestabilité et de la justice.","<b>Créer :</b> formuler des règles de gouvernance appropriées à un établissement."],
  ancrage_html:"<p>L'usage de l'IA « n'est jamais un fait purement technique » : il touche « aux droits, aux opportunités, à la réputation et à la liberté » (§102). Danger de l'« injustice silencieuse » (§103). On ne peut « considérer l'IA comme moralement neutre » (§104). Exigence de responsabilité : identifier qui doit rendre compte et réparer (§105). « Une IA plus morale ne sert à rien si cette morale est décidée par une poignée de personnes » (§107). Appel à « désarmer » l'IA : la rendre « discutable, contestable, et donc habitable » (§110).</p><p class='foot' style='text-align:left'><b>Références :</b> Lc 10, 25-37 · Mi 6, 8 · Ga 6, 5 · Antiqua et nova (2025) · UNESCO (2021).</p>",
  synthese:"« La qualité d'une civilisation ne se mesure pas à la puissance de ses moyens, mais à l'attention qu'elle sait offrir » (§114). La gouvernance ne peut se contenter d'invoquer l'éthique : elle demande « des cadres juridiques adéquats, une surveillance indépendante, l'éducation des utilisateurs, une politique qui n'abdique pas » (§106).",
  table:{cap:"Les alertes majeures — grille de discernement",head:["Alerte","Question d'audit"],rows:[["Injustice silencieuse","Qui peut contester la décision, et devant qui ?"],["Neutralité prétendue","Que mesure-t-il ? Qu'ignore-t-il ? Qui décide ?"],["Opacité","Peut-on reconstituer et motiver la décision ?"],["Concentration du pouvoir","À qui profite cet usage ? Qui possède les données ?"],["Course « armée » cognitive","Cet usage sert-il le bien commun ou un avantage ?"]]},
  activites:[["Escape game — « La décision opaque » (45 min)","Reconstituer la chaîne des responsabilités et rédiger la voie de recours."],["Débat structuré (world café, 40 min)","« Faut-il ralentir l'adoption de l'IA à l'école ? » (§106)."],["Atelier « Désarmer » (30 min)","Traduire §110 en 4 gestes : rendre l'usage discutable, contestable, accessible, sobre."],["H5P — Branching « Je conçois, donc je choisis »","Chaque choix de conception révèle « une vision de l'humanité » (§111)."]],
  livrable:"Un mini-cadre de gouvernance de l'IA (responsabilité, voie de recours, transparence, sobriété) — fondation de la charte finale."},

 {code:"M4",deck:"m4",titre:"IA et éducation : l'alliance éducative et le rôle de l'école",ancrage:"Chapitre 4 §139-147",duree:"4 h",central_head:"Module central",
  objectifs:["<b>Comprendre :</b> exposer les trois défis de l'école (sociopolitique, pédagogique, intellectuel).","<b>Appliquer :</b> concevoir une activité qui « éduque à décider quand et pourquoi ne pas utiliser l'IA » (§140).","<b>Créer :</b> produire une mini-séquence intégrant une « hygiène de l'attention »."],
  ancrage_html:"<p>« Toute technologie éduque ceux qui l'utilisent. Éduquer à l'utilisation de l'IA implique donc d'éduquer à décider quand et pourquoi ne pas l'utiliser » (§140) ; il faut « nous éduquer à jeûner de l'IA ». L'école est « le lieu où les nouvelles générations peuvent apprendre à rechercher et à aimer la vérité » (§143). Trois défis : sociopolitique (inégalités d'accès, §144), pédagogique (programmes, méthodes, évaluation, formation des enseignants, §145), intellectuel (l'information se substitue à la recherche ; « hygiène de l'attention », §146).</p><p class='foot' style='text-align:left'><b>Références :</b> Pr 8, 22-31 · Dt 6, 6-7 · Lc 2, 52 · 1 R 3, 9 · UNESCO (2021, 2023) · Pacte éducatif mondial (2020).</p>",
  synthese:"« L'école n'est pas appelée à courir après la rapidité du monde numérique, mais à offrir ce que le numérique seul ne peut donner : du temps partagé pour apprendre et des relations de confiance » (§147). Apprendre à utiliser l'IA suppose d'apprendre à s'en passer à bon escient — pratiquer le « jeûne de l'IA », cultiver le silence, la lecture lente, le débat où l'on « frotte » les concepts « comme du silex » jusqu'à l'étincelle de la compréhension (§140).",
  opp:["Personnalisation, différenciation et remédiation","Assistance à la préparation et à l'évaluation formative","Accessibilité (besoins particuliers, traduction, lecture)","Libération de temps enseignant pour la relation"],
  al:["Extinction du désir de questionner (§140)","Fragmentation des savoirs (§146)","Santé et sécurité des mineurs (§141-142)","Inégalités d'accès (§144) ; délégation du jugement (§100)"],
  activites:[["Atelier phare (90 min, pairs)","Produire une mini-séquence : 1 objectif, 1 activité avec IA, 1 activité sans IA délibérément, 1 critère de discernement, 1 évaluation intègre."],["Jeu de plateau — « L'alliance éducative »","Quatre pions (École, Famille, Autorité, Élève) : décider en associant les quatre acteurs (§142)."],["H5P Branching — « La classe hyperstimulée »","Gérer une classe marquée par l'immédiateté ; aboutir à un protocole d'« hygiène de l'attention »."],["Kahoot! — « Sagesse ou information ? »","Distinguer donnée, information, connaissance, sagesse — situer où l'IA aide et où elle ne peut suppléer."]],
  livrable:"Une mini-séquence « IA & discernement » prête à l'emploi (préparation + critère d'intégrité + protocole d'attention). Réutilisée dans le plan d'action final (M7)."},

 {code:"M5",deck:"m5",titre:"Travail, liberté et nouvelles formes d'esclavage",ancrage:"Chapitre 4 §148-181",duree:"3 h",
  objectifs:["<b>Comprendre :</b> exposer la valeur du travail et les risques de la transition numérique.","<b>Analyser :</b> repérer les « chaînes invisibles » (travail du clic, extraction minière, traite) derrière les usages d'IA.","<b>Évaluer :</b> relier liberté intérieure, sobriété numérique et protection des plus vulnérables."],
  ancrage_html:"<p>Le travail « exprime et renforce la dignité de notre vie » (§149). Les approches actuelles de l'IA peuvent « déqualifier les travailleurs, les soumettre à une surveillance automatisée » (§150) ; « la personne humaine est une fin et non un moyen » (§152). L'économie de l'attention « capte le temps et le regard » (§170) ; le contrôle social profile et oriente (§171). « Rien, dans le monde de l'IA, n'est immatériel ou magique » (§173) : étiquetage de données, modération, extraction minière, traite via plateformes. « Colonialisme des données » (§178) ; appel à la <i>due diligence</i> (§179).</p><p class='foot' style='text-align:left'><b>Références :</b> Gn 2, 15 · Ex 20, 8-10 · Lv 25, 10 · Jc 5, 4 · Ga 5, 1 · Rerum novarum (1891) · Zuboff (2019).</p>",
  synthese:"L'IA peut « soulager l'homme de travaux pénibles, répétitifs ou dangereux » et « libérer du temps » (§152, §156) <b>si</b> elle est « centrée sur la personne et non seulement sur la performance » (§150).",

 {code:"M6",deck:"m6",titre:"Culture du pouvoir, paix et armes autonomes",ancrage:"Chapitre 5 §182-228",duree:"3 h",

  synthese:"La « culture du pouvoir » traite la force comme un droit et la guerre comme une fatalité ; la « civilisation de l'amour » y oppose la justice, le dialogue et la protection des plus faibles. Point de non-retour éthique : <b>les décisions mortelles ou irréversibles ne peuvent être déléguées à des systèmes artificiels</b> (§198-200). Pour l'école : éducation à la paix, discernement des récits (désinformation, §132-134), « désarmement des mots ».",
  activites:[["Atelier « Désarmer les mots » (40 min)","Repérer les procédés de « fabrication de peurs » (§206) et réécrire en « langage évangélique » (§14)."],["Débat structuré","« Peut-on confier une décision létale à une machine ? » autour des trois critères (§199)."],["Jeu — « Le fil de la responsabilité »","Reconstituer la chaîne « planifie → forme → autorise → utilise » (§199)."],["Production « Micro-projet de paix numérique »","Une action éducative contre la désinformation ou le cyberharcèlement."]],
  livrable:"Un micro-projet d'éducation à la paix numérique (anti-désinformation / anti-cyberharcèlement), intégrable au projet d'établissement."},

function deckEss(key){
  const slides=DECKS[key]||[]; const s=slides.find(x=>x.ess); if(!s||!s.ess) return '';
  return '<div class="keypts">'+s.ess.map(e=>'<div class="kp"><span class="kic">'+e[0]+'</span><div><b>'+esc(e[1])+'</b> — '+esc(e[2])+'</div></div>').join('')+'</div>';
}

/* ---- Rendu d'une question (formulaire) ---- */
function qHTML(q,idx,opt){
  opt=opt||{};
  const shuffleOpts=opt.shuffle;
  let body='';
  const tag='<span class="tag">'+esc(q.id)+'</span>';
  const head='<p class="qn">'+tag+esc(q.q)+'</p>';
  if(q.type==='qcm'||q.type==='vf'){
    // value = choix STABLE (index d'origine pour QCM, 'V'/'F' pour vrai-faux) ; data-ok = exactitude.
    let opts;
    if(q.type==='vf') opts=[{t:'Vrai',val:'V',ok:q.vrai?1:0},{t:'Faux',val:'F',ok:q.vrai?0:1}];
    else opts=q.o.map((o,i)=>({t:o[0],val:String(i),ok:o[1]}));
    if(shuffleOpts) opts=shuffle(opts);
    // Nom de groupe UNIQUE par (contexte, question) : évite que deux modules ouverts partagent un groupe radio.
    const gname='qg_'+idx+'_'+(q.id||'x');
    body=opts.map(o=>'<label class="opt-row"><input type="radio" name="'+gname+'" value="'+o.val+'" data-ok="'+o.ok+'"><span>'+esc(o.t)+'</span></label>').join('');
  } else if(q.type==='trou'){
    let parts=q.q.split('__');
    // on ré-affiche l'énoncé sans les tirets, avec des champs (le head montre déjà l'énoncé)
    body=q.sol.map((s,i)=>'<div style="margin:4px 0"><span style="color:var(--muted);font-size:13px">Réponse '+(i+1)+' :</span> <input class="trou-in" data-blank="'+i+'" autocomplete="off"></div>').join('');
  } else if(q.type==='appar'){
    body=q.g.map((g,i)=>'<div class="appar-row"><div class="g">'+esc(g)+'</div><div style="color:var(--muted)">→</div><select data-pair="'+i+'"><option value="">— choisir —</option>'+
      q.d.map((d,j)=>'<option value="'+j+'">'+esc(d)+'</option>').join('')+'</select></div>').join('');
  }
  return '<div class="q" data-qid="'+esc(q.id)+'" data-type="'+q.type+'">'+head+body+'<div class="fb" data-fb></div></div>';
}
/* ---- Correction d'une question dans un conteneur DOM ---- */
function gradeQ(qEl,q,reveal){
  let ok=false;
  if(q.type==='qcm'||q.type==='vf'){
    const sel=$('input:checked',qEl);
    ok = !!sel && sel.getAttribute('data-ok')==='1';
    if(reveal){
      $$('.opt-row',qEl).forEach(r=>{
        const inp=$('input',r);const v=inp.getAttribute('data-ok')==='1';
        r.classList.remove('ok','ko','miss');
        if(inp.checked&&v) r.classList.add('ok');
        else if(inp.checked&&!v) r.classList.add('ko');
        else if(!inp.checked&&v) r.classList.add('miss');
      });
    }
  } else if(q.type==='trou'){
    ok=true;
    $$('.trou-in',qEl).forEach(inp=>{
      const i=parseInt(inp.getAttribute('data-blank'),10);
      const acc=q.sol[i].map(norm);
      const good=acc.indexOf(norm(inp.value))>=0;
      if(!good) ok=false;
      if(reveal){inp.classList.remove('ok','ko');inp.classList.add(good?'ok':'ko');}
    });
  } else if(q.type==='appar'){
    ok=true;
    $$('select',qEl).forEach(sel=>{
      const i=parseInt(sel.getAttribute('data-pair'),10);
      const good=String(q.sol[i])===sel.value;
      if(!good) ok=false;
      if(reveal){sel.classList.remove('ok','ko');sel.classList.add(good?'ok':'ko');}
    });
  }
  if(reveal){
    const fb=$('[data-fb]',qEl);
    fb.className='fb show '+(ok?'good':'bad');
    fb.innerHTML=(ok?'✓ Bonne réponse. ':'✗ À revoir. ')+(q.fb?('<span style="opacity:.85">'+esc(q.fb)+'</span>'):'');
  }
  return ok;
}

/* ---- Exercices d'un module (feedback immédiat, sans chrono) ---- */
function moduleQuiz(mod){
  const qs=BANK.filter(q=>q.mod===mod);
  const id='mq_'+mod;
  return '<div class="quiz" id="'+id+'">'+qs.map((q)=>qHTML(q,'mod'+mod)).join('')+
    '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn primary" data-mqcheck="'+mod+'">Vérifier mes réponses</button>'+
    '<button class="btn" data-mqreset="'+mod+'">Réinitialiser</button></div>'+
    '<div data-mqscore style="margin-top:10px;font-weight:700;color:var(--forest)"></div></div>';
}
document.addEventListener('click',function(e){
  const cid=e.target.getAttribute&&e.target.getAttribute('data-mqcheck');
  if(cid){
    const box=document.getElementById('mq_'+cid);const qs=BANK.filter(q=>q.mod===cid);
    let ok=0;$$('.q',box).forEach((qEl,i)=>{if(gradeQ(qEl,qs[i],true))ok++;});
    $('[data-mqscore]',box).textContent='Score : '+ok+' / '+qs.length+(ok===qs.length?' — parfait !':'');
    return;
  }
  const rid=e.target.getAttribute&&e.target.getAttribute('data-mqreset');
  if(rid){
    const box=document.getElementById('mq_'+rid);
    $$('input',box).forEach(i=>{i.checked=false;});$$('.trou-in',box).forEach(i=>{i.value='';i.className='trou-in';});
    $$('select',box).forEach(s=>{s.value='';s.className='';});
    $$('.opt-row',box).forEach(r=>r.classList.remove('ok','ko','miss'));
    $$('[data-fb]',box).forEach(f=>f.className='fb');$('[data-mqscore]',box).textContent='';
  }
});

// « Le cours » : narratif développé par module (d'après le livret APPRENANT).
const COURS = {"M0":"<p>Il faut, pour comprendre ce que l'intelligence artificielle fait à notre humanité, remonter très loin — bien avant les circuits et les serveurs, jusqu'à deux chantiers que sépare un abîme de plusieurs siècles. Le premier s'élève sur la plaine de Shinéar : des hommes y cuisent des briques, inventent un mortier nouveau et se donnent un mot d'ordre grisant — bâtir une tour dont le sommet toucherait le ciel, et « se faire un nom ». Le second se dresse sur les décombres de Jérusalem : un homme, Néhémie, apprend que les murs de la ville sont abattus. Avant de saisir la moindre truelle, il s'assied, pleure, jeûne et prie ; puis, la nuit, il longe les ruines pour les mesurer, avant de convoquer le peuple.<\/p>\n<p>Ces deux images ne sont pas de simples ornements bibliques. L'encyclique <i>Magnifica Humanitas<\/i> les place, dès ses premières pages, au seuil de toute réflexion sur l'IA (§7-16), parce qu'elles disent l'essentiel : une même énergie humaine, un même génie technique, peuvent édifier la dispersion ou la communion, l'orgueil ou le service. La question que nous pose l'intelligence artificielle n'est pas d'abord technique. Elle est, très exactement, celle de Babel et de Jérusalem.<\/p>\n<h4 class=\"cours-h\">Le nouveau limon<\/h4>\n<p>Nos « briques » d'aujourd'hui portent d'autres noms : données, modèles, paramètres, algorithmes. Le limon a changé de nature — il est devenu information — mais la tentation, elle, n'a pas vieilli d'un jour. Bâtir pour dominer plutôt que pour habiter ; réduire l'infinie diversité des langues, des visages et des histoires à un seul code, une seule mesure, une seule optimisation ; se passer de tout Autre, comme si l'homme pouvait être à lui-même sa propre origine et sa propre fin. Léon XIV se garde bien de condamner la technique — il rappelle au contraire qu'elle est un don, une part de la vocation créatrice de l'homme (§11-13). Ce qu'il interroge, c'est l'intention qui la façonne.<\/p>\n<p>Car aucune œuvre humaine n'est neutre. Une tour dit quelque chose de ceux qui la bâtissent ; un algorithme aussi. Derrière le mot rassurant d'« outil » se cache toujours une vision de l'homme : ce que l'on juge digne d'être mesuré, accéléré, automatisé — et ce que l'on accepte de laisser dans l'ombre. C'est pourquoi le premier travail d'un éducateur n'est pas de maîtriser la machine, mais de discerner le projet d'humanité qu'elle porte.<\/p>\n<h4 class=\"cours-h\">Babel : l'orgueil qui disperse<\/h4>\n<p>Le paradoxe de Babel est cruel : à force de vouloir tout unifier, les bâtisseurs finissent dispersés ; à force de rêver un langage unique, ils ne se comprennent plus. L'Écriture ne raconte pas la punition d'un Dieu jaloux de la réussite humaine, mais le naufrage intérieur d'un projet fondé sur la seule puissance. Là où l'on cherche à s'élever contre le ciel, on s'effondre en soi-même.<\/p>\n<p>L'encyclique nomme les traits de cet esprit babélien (§10) : l'idolâtrie de la performance, l'uniformisation qui gomme les singularités, l'illusion d'autosuffisance. Ce sont des tentations très concrètes pour une école : céder au tout-numérique par peur de « prendre du retard » ; noter, classer, prédire au point d'oublier le visage de l'élève ; croire qu'un tableau de bord dit la vérité d'une personne. Une société qui confierait tout à l'IA — le jugement, la relation, la décision, la mémoire — connaîtrait le sort de Babel : une prouesse technique et un désert humain.<\/p>\n<h4 class=\"cours-h\">Jérusalem : la communion qui reconstruit<\/h4>\n<p>À l'opposé se tient Néhémie. Sa méthode tient en peu de mots : prier avant d'agir, écouter avant de décider, partager la tâche avant de l'imposer. Le récit déroule une liste étonnante — telle famille répare telle porte, tel groupe tel pan de mur. Personne ne bâtit tout ; chacun bâtit sa part. La ville renaît non par la force d'un seul, mais par la responsabilité de tous. C'est l'exact contraire de Babel : la diversité n'y est plus une menace à réduire, mais la condition même de l'édifice.<\/p>\n<p>Voilà le « style Jérusalem » que l'encyclique propose d'appliquer à la technique (§8-9) : une IA que l'on n'adopte pas pour dominer mais pour servir ; que l'on met au travail dans un climat de coresponsabilité, de transparence et d'attention aux plus fragiles. La même truelle peut monter une tour d'orgueil ou relever un rempart de communion. Tout dépend de la main — et du cœur — qui la tient.<\/p>\n<blockquote class=\"cours-cite\">« La technique n'est jamais neutre : elle porte toujours un projet d'humanité. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Pour une école catholique, ce premier module n'est pas une introduction que l'on pourrait sauter : il fixe la grammaire de tout le reste. La question n'est jamais « pour ou contre l'IA » — poser le débat ainsi, c'est déjà l'avoir mal posé. La vraie question est : quel visage de l'homme voulons-nous servir, et quel style de construction adoptons-nous ?<\/p><p>Gardez donc cette double image à portée de main. Chaque fois qu'un usage de l'IA se présentera — dans une classe, un bureau, un conseil — il suffira de la convoquer : sommes-nous en train de bâtir Babel, ou de reconstruire Jérusalem ? Ce discernement, tout simple, est le fil rouge de la formation. Et le premier choix, déjà, vous appartient.<\/p><\/div>","M1":"<p>Une machine bat le champion du monde d'échecs, puis celui de go — ce jeu que l'on croyait à jamais réservé à l'intuition humaine. Elle compose des sonnets, imite une voix aimée, repère sur une radiographie la tache infime qu'un œil fatigué aurait laissée passer. Devant ces prouesses, une inquiétude sourde monte : s'il n'est plus rien que la machine ne fasse mieux que nous, qu'est-ce qui nous rend encore irremplaçables ?<\/p>\n<p>La réponse de la tradition chrétienne surprend par son audace : rien de ce que vous faites. Votre valeur ne se mesure pas à vos performances — et c'est précisément pour cela qu'aucune machine ne pourra jamais vous égaler sur ce terrain, car ce terrain n'est pas celui du faire, mais celui de l'être. La dignité ne se gagne pas ; elle se reçoit.<\/p>\n<h4 class=\"cours-h\">À l'image de Dieu<\/h4>\n<p>Tout commence par une affirmation vertigineuse du premier chapitre de la Genèse : l'être humain est créé « à l'image et à la ressemblance » de Dieu (Gn 1,26-27). L'encyclique en fait le socle de son anthropologie (Chapitre 2). Être imago Dei ne signifie pas être le plus intelligent des animaux, ni le plus efficace des systèmes : c'est être aimé d'un amour qui précède tout mérite, appelé à une relation, capable de vérité, de liberté et de don.<\/p>\n<p>De là découle une conséquence pratique immense : cette dignité ne dépend ni de la performance, ni de l'utilité, ni de la santé, ni de l'âge. Le nourrisson, le malade, la personne âgée, l'élève en grande difficulté la possèdent tout entière. Elle est un socle inébranlable, non une récompense à conquérir. Aucun classement, aucun score, aucun algorithme ne peut l'accroître ni l'entamer.<\/p>\n<h4 class=\"cours-h\">Calculer n'est pas comprendre<\/h4>\n<p>Que fait exactement une IA ? Elle traite d'immenses quantités de données, repère des régularités, prédit la suite la plus probable. C'est prodigieux — et radicalement autre chose que comprendre. L'encyclique le formule avec netteté (§99) : l'IA imite, simule, mais n'habite pas le monde. Elle peut produire les mots de l'empathie sans jamais souffrir avec l'autre ; enchaîner des raisonnements moraux sans conscience du bien et du mal ; parler d'espérance sans jamais espérer.<\/p>\n<p>La différence n'est pas de degré, mais de nature. Là où l'homme cherche un sens, la machine optimise une fonction ; là où l'homme s'interroge sur ce qu'il doit faire, la machine calcule ce qui est probable. Confondre les deux — prendre la simulation pour la réalité — n'est pas une erreur technique anodine : c'est le premier pas vers une réduction de l'humain. La note doctrinale <i>Antiqua et nova<\/i> (2025) le rappelait déjà : l'intelligence humaine engage tout l'être, corps, cœur et esprit, quand l'IA n'en manipule que des traces.<\/p>\n<h4 class=\"cours-h\">Une grille pour juger<\/h4>\n<p>Cette conviction n'est pas qu'une belle idée : elle se traduit en critère. Un système qui exclurait une personne « sans possibilité d'appel » (§104), qui la réduirait à un profil, un risque, un score sans recours, contredirait déjà, dans les faits, sa dignité. La contestabilité n'est pas un luxe procédural : c'est une exigence anthropologique.<\/p>\n<p>Pour l'éprouver, la Doctrine sociale de l'Église offre cinq clés — le bien commun, la destination universelle des biens, la subsidiarité, la solidarité, la justice sociale — que ce module transforme en grille d'audit. Chacune devient une question concrète : cet usage sert-il l'épanouissement de tous ? Élargit-il l'accès ou le restreint-il ? Décide-t-on au plus près des personnes ? Reconnaît-on le travail invisible ? Corrige-t-on les biais dès la conception ? Répondre honnêtement, preuves à l'appui, c'est déjà gouverner.<\/p>\n<blockquote class=\"cours-cite\">« L'IA calcule ; elle ne devient pas sage. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Dans une salle de classe, cette anthropologie change tout. L'élève le plus lent, le plus fragile, celui que les tableaux de bord signalent en rouge, garde une dignité que nulle note, nul algorithme ne saurait diminuer. Fonder l'éducation sur l'imago Dei, c'est refuser absolument que la personne soit un jour réduite à ses résultats.<\/p><p>C'est aussi libérer l'enseignant. S'il n'est pas engagé dans une course de vitesse contre la machine, il peut redevenir ce que lui seul peut être : un témoin, un éveilleur de sens, quelqu'un qui regarde l'élève et non ses statistiques. La question n'est plus « la machine va-t-elle me remplacer ? », mais « qu'est-ce qui, en moi, est proprement irremplaçable ? » — et la réponse est immense.<\/p><\/div>","M2":"<p>Après avoir posé les fondations — le choix de Babel ou de Jérusalem, la dignité inaliénable de la personne — il serait tentant, pour une conscience chrétienne inquiète, de ne plus voir dans l'IA qu'une menace. Ce serait une faute, et l'encyclique s'en garde soigneusement. Bien orientée, l'intelligence artificielle soigne, relie, rend accessible ce qui ne l'était pas ; elle peut être, dit le texte sans détour, « une aide précieuse » (§93).<\/p>\n<p>Mais aussitôt une nuance décisive s'impose : une aide n'est pas un maître. Toute la sagesse de ce module tient dans cet interstice — savoir accueillir le bien réel que l'IA peut produire, sans lui abandonner le gouvernail. Discerner, ici, ce n'est pas hésiter ; c'est aimer assez la personne pour ne retenir que ce qui la sert.<\/p>\n<h4 class=\"cours-h\">Des fruits bien réels<\/h4>\n<p>Refuser l'angélisme n'oblige pas à nier l'évidence. Un diagnostic accéléré qui décèle plus tôt une maladie ; un service public enfin accessible à qui n'osait plus pousser une porte ; un élève dyslexique qui, grâce à une aide adaptée, retrouve le goût de lire ; une alerte météo qui sauve une récolte et, avec elle, la subsistance d'une famille : ces bénéfices ne sont pas des fantasmes de brochure commerciale. Ils participent de ce que la tradition appelle le développement humain intégral (§90-101) — celui qui touche tout l'homme et tous les hommes.<\/p>\n<p>L'encyclique invite même à y voir une part de la vocation de l'homme à cultiver et garder la création. Le talent que l'on enfouit, dit la parabole, est un talent perdu (Mt 25). Il ne s'agit donc pas de se méfier par principe, mais de mettre la puissance nouvelle au service de fins justes : la santé, l'inclusion, la connaissance, le soin de la maison commune.<\/p>\n<h4 class=\"cours-h\">Le piège : plus puissant n'est pas meilleur<\/h4>\n<p>Et pourtant, une phrase revient comme un avertissement, empruntée au philosophe Romano Guardini et reprise par l'encyclique (§93) : la puissance accrue n'est pas, en elle-même, un progrès. L'histoire l'a assez montré — chaque bond technique a servi le meilleur et le pire. Ce qui décide de la valeur d'un usage, ce n'est jamais sa performance brute, mais la direction qu'on lui donne.<\/p>\n<p>L'encyclique désigne trois pièges à surveiller de près (§100). La facilité, d'abord, qui endort le jugement : à toujours obtenir la réponse sans effort, on désapprend à chercher. L'illusion d'objectivité, ensuite : une réponse d'IA paraît neutre, alors qu'elle porte les choix, les angles morts et les préjugés de ceux qui l'ont conçue. La relation simulée, enfin : un agent conversationnel imite la présence, mais ne remplace pas une rencontre. À quoi s'ajoute un coût trop souvent oublié — l'énergie, l'eau, le carbone qu'une seule requête consomme (§101).<\/p>\n<h4 class=\"cours-h\">La règle d'or<\/h4>\n<p>Comment, dès lors, trancher au cas par cas ? Ce module propose une boussole simple, une « règle d'or » en trois questions. Un usage de l'IA est-il une véritable opportunité ? Oui, si — et seulement si — il sert réellement la personne, s'il demeure sous responsabilité humaine, et s'il n'aggrave ni les inégalités ni l'empreinte écologique.<\/p>\n<p>Ces trois conditions ne sont pas réunies par hasard : ensemble, elles empêchent qu'un bénéfice apparent ne masque un dommage caché. Un outil qui aide les uns en excluant les autres, qui soulage aujourd'hui en épuisant demain, qui rend service en dépossédant de toute maîtrise, n'est pas une opportunité : c'est un mirage. La règle d'or transforme l'enthousiasme en discernement.<\/p>\n<blockquote class=\"cours-cite\">« Un bénéfice n'est une opportunité que s'il sert la personne. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Pour votre établissement, ce module ouvre un espace de liberté. Il autorise à dire oui — à l'accessibilité, à l'inclusion, à la personnalisation qui remet l'élève en difficulté en selle — sans naïveté, parce que le oui est passé au crible de la règle d'or.<\/p><p>Il apprend surtout à tenir ensemble deux attitudes que l'on oppose trop souvent : l'accueil et la vigilance. Ni technophobie ni technolâtrie, mais un discernement adulte, qui garde la main, la sobriété et le cap. « La personne d'abord » n'est pas un slogan : c'est un critère de tri.<\/p><\/div>","M3":"<p>Un dossier de bourse refusé sans motif. Un élève orienté, malgré lui, vers une voie qu'il n'a pas choisie. Un profil discrètement classé « à risque ». Et, chaque fois, la même phrase qui tombe comme un couperet et clôt tout débat : « c'est l'algorithme qui l'a décidé ». Cette petite phrase, en apparence anodine, contient un poison : elle prétend qu'une décision engageant des vies serait devenue une donnée de la nature, aussi indiscutable que la météo.<\/p>\n<p>L'encyclique donne un nom à ce vertige : l'injustice silencieuse (§103). Silencieuse, parce qu'elle avance masquée sous les traits de la neutralité ; injuste, parce qu'elle exclut sans que l'on puisse même protester. Ce module est le cœur éthique du parcours : apprendre à faire parler ce silence, à rendre à la décision son visage humain — et donc sa responsabilité.<\/p>\n<h4 class=\"cours-h\">Le mythe de la neutralité<\/h4>\n<p>La première illusion à dissiper est celle de la neutralité morale. Aucun système d'IA n'est neutre (§102), pour une raison simple : il ne voit que ce qu'on lui a appris à voir. Il mesure certaines choses, en ignore d'autres, hérite des biais présents dans ses données, reflète les priorités de ceux qui l'ont commandé. Une « objectivité » algorithmique est toujours une subjectivité qui s'ignore, ou qui se cache.<\/p>\n<p>Reconnaître cela n'est pas verser dans la suspicion généralisée ; c'est retrouver le sens des responsabilités. Car derrière chaque décision automatisée se tient une chaîne humaine : ceux qui ont conçu le modèle, ceux qui l'ont entraîné, ceux qui l'ont déployé, ceux qui s'y fient. Le premier acte de gouvernance consiste précisément à rendre cette chaîne visible — à pouvoir répondre à la question la plus simple et la plus redoutée : qui, ici, rend compte ?<\/p>\n<h4 class=\"cours-h\">« Désarmer » l'IA<\/h4>\n<p>L'encyclique emploie alors une expression forte, presque provocante : il faut « désarmer » l'IA (§110). Le mot pourrait effrayer ; il ne signifie nullement y renoncer. Désarmer, c'est ôter à la technique son pouvoir de domination : la rendre discutable, contestable, accessible. C'est refuser qu'elle devienne un pouvoir sans visage, concentré entre quelques mains, contre lequel l'individu ne pourrait rien.<\/p>\n<p>Concrètement, gouverner un système d'IA suppose quatre capacités (§105) : identifier qui en répond, motiver ses décisions, les contester, les réparer. Une institution mûre n'est pas celle qui possède la technologie la plus rapide ou la plus impressionnante ; c'est celle qui garde, en toute circonstance, le droit de dire non — et qui l'a organisé à l'avance.<\/p>\n<h4 class=\"cours-h\">De la transparence à la charité<\/h4>\n<p>On croit souvent que transparence, traçabilité et voie de recours sont des lourdeurs administratives, des contraintes que l'on subit. L'encyclique renverse ce regard. Prévoir un réexamen humain, expliquer une décision, ouvrir une possibilité d'appel, ce n'est pas alourdir un processus : c'est protéger une personne — et d'abord la plus fragile, celle qui n'a ni les mots ni les relations pour se défendre seule.<\/p>\n<p>Ainsi la gouvernance de l'IA, loin d'être une affaire de juristes, devient une œuvre de justice, et même de charité. Documenter les usages, vérifier ses fournisseurs, former les acteurs, désigner des responsables : autant de gestes concrets par lesquels une communauté éducative dit à chacun de ses membres qu'il ne sera jamais réduit à une ligne dans une base de données.<\/p>\n<blockquote class=\"cours-cite\">« Gouverner l'IA, c'est garder le droit de la contester. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Pour votre établissement, ce module se traduit en décisions très concrètes : une clause de recours pour toute décision assistée par l'IA, un responsable identifié, une trace consultable, une formation des équipes. Rien d'héroïque — mais tout ce qui, mis bout à bout, empêche l'injustice silencieuse de s'installer.<\/p><p>C'est aussi un témoignage. Dans un monde qui se résigne trop vite au « c'est l'algorithme qui l'a décidé », une école qui maintient partout la responsabilité humaine affirme, sans discours, une conviction : aucune personne ne mérite d'être exclue sans recours. La transparence est ici la forme concrète de la charité.<\/p><\/div>","M4":"<p>Imaginez, un instant, la classe « parfaite » telle qu'on nous la promet parfois : chaque question y trouve aussitôt sa réponse, chaque exercice sa correction, chaque hésitation son secours immédiat. Plus d'effort inutile, plus d'attente, plus de ces silences où l'on ne sait pas encore. Puis posez la vraie question : est-ce encore une école ? Ou n'est-ce plus qu'un guichet de réponses, où l'on ne grandit plus parce que rien ne résiste ?<\/p>\n<p>Ce module — le cœur battant de toute la formation — part d'un paradoxe lumineux, formulé par l'encyclique avec une audace tranquille : à l'ère de l'IA, la première compétence à transmettre n'est pas de savoir s'en servir, mais de savoir quand et pourquoi ne pas s'en servir (§140). Éduquer, ce n'est pas armer l'élève d'outils ; c'est former en lui un discernement.<\/p>\n<h4 class=\"cours-h\">Toute technologie éduque<\/h4>\n<p>Il n'existe pas d'outil neutre pour celui qui grandit. Un instrument façonne toujours, en creux, celui qui l'emploie : il oriente son attention, sollicite ou atrophie sa mémoire, modèle son désir. L'encyclique reprend ici une intuition ancienne : « toute technologie éduque » (§140). La calculatrice a changé notre rapport au calcul ; l'écran, notre rapport au temps ; l'IA, si nous n'y prenons garde, changera notre rapport à l'effort même de penser.<\/p>\n<p>D'où ce renversement pédagogique : apprendre à se servir de l'IA, c'est indissociablement apprendre à s'en passer. Il faut réhabiliter l'effort là où l'effort est le but — le premier jet écrit sans assistance, le problème que l'on cherche longtemps, le texte que l'on relit lentement. Non par nostalgie ni par méfiance, mais parce que c'est dans cette peine féconde que se forme une intelligence libre. Une réponse obtenue sans chemin n'instruit personne.<\/p>\n<h4 class=\"cours-h\">L'hygiène de l'attention<\/h4>\n<p>Face à un monde qui a fait de l'immédiateté sa loi, l'encyclique propose une ascèse d'une simplicité désarmante, qu'elle nomme « hygiène de l'attention » (§146) : ménager du silence, pratiquer la lecture lente, cultiver le débat réel, préserver des plages sans écran. Il ne s'agit pas de bannir la technique, mais de protéger ce bien fragile et menacé qu'est la liberté intérieure — cette capacité de se recueillir, de tenir une pensée, de résister à la sollicitation permanente.<\/p>\n<p>L'attention, en effet, est aujourd'hui un champ de bataille. Une part entière de l'économie numérique vit de la capter, de la fragmenter, de la revendre. L'école devient alors l'un des derniers lieux où l'on apprenne, contre le courant, à demeurer présent à une seule chose, à un seul texte, à un seul visage. Enseigner l'attention, c'est déjà former des hommes et des femmes libres.<\/p>\n<h4 class=\"cours-h\">L'alliance éducative<\/h4>\n<p>Enfin, éduquer à l'ère de l'IA ne saurait être l'affaire de l'école seule. L'encyclique parle d'une « alliance éducative » à renouer (§142, §147) : l'école, les familles, les autorités et l'Église, coresponsables d'un même trésor — la croissance des jeunes. Protéger les mineurs des contenus nocifs, des écrans trop précoces, du cyberharcèlement, suppose que tous marchent dans le même sens.<\/p>\n<p>Cette alliance dessine aussi la véritable place de l'école. Elle n'a pas à courir après la vitesse des machines — ce combat est perdu d'avance, et il n'a pas de sens. Elle a à offrir ce que nulle machine ne donnera jamais : du temps partagé, une relation de confiance, un regard qui accueille. Là est son irremplaçable dignité (§147).<\/p>\n<blockquote class=\"cours-cite\">« Éduquer à l'IA, c'est éduquer à sa juste distance. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Pour vos équipes, ce module est le plus opérationnel de tous. Il invite à concevoir des séquences où l'IA est délibérément écartée à un moment clé, pour laisser à l'effort sa place formatrice ; à instaurer des rituels d'attention ; à écrire, avec les élèves, des règles d'usage qui disent aussi quand ne pas utiliser.<\/p><p>Il rend surtout leur grandeur aux éducateurs. À l'heure où certains redoutent d'être remplacés, l'encyclique leur confie une mission que nulle IA ne pourra jamais assumer : accompagner une liberté qui s'éveille. Votre mission n'est pas de distribuer des réponses, mais de faire naître des questions — et, avec elles, des personnes.<\/p><\/div>","M5":"<p>Vous ouvrez une application ; en une seconde, une réponse s'affiche, fluide, gratuite en apparence. Ce que l'écran ne montre pas : quelque part, des serveurs qui chauffent et boivent des litres d'eau ; des mines où l'on arrache les métaux rares de nos appareils ; et, dispersés sur la planète, des milliers de travailleurs invisibles qui ont trié, étiqueté, modéré les données pour un salaire de misère et, parfois, au prix de leur santé psychique.<\/p>\n<p>L'encyclique résume cette réalité d'une formule qui devrait nous poursuivre : « Rien, dans le monde de l'IA, n'est immatériel » (§173). Derrière le nuage — le fameux cloud — il y a de la terre, de l'énergie et des visages. Ce module apprend à voir ces chaînes invisibles, et à en tirer les conséquences pour notre liberté.<\/p>\n<h4 class=\"cours-h\">La dignité du travail<\/h4>\n<p>Il faut d'abord retrouver le sens du travail. Pour la Doctrine sociale de l'Église, il n'est pas qu'un moyen de subsistance : il exprime et renforce la dignité de la personne (§149), il l'associe à l'œuvre créatrice, il tisse du lien social. C'est pourquoi la manière dont l'IA transforme le travail n'est jamais une question purement technique ou économique : c'est une question morale.<\/p>\n<p>Or une intégration mal pensée peut abîmer le travail au lieu de le servir (§150-152) : déqualifier des métiers, soumettre les personnes à une surveillance automatisée, précariser, réduire l'humain à un rouage que l'on optimise. Le critère est clair et exigeant : la personne est toujours une fin, jamais un simple moyen. Une technologie qui l'oublie, si performante soit-elle, travaille contre l'homme.<\/p>\n<h4 class=\"cours-h\">Les chaînes invisibles<\/h4>\n<p>L'encyclique décrit ensuite des servitudes d'un genre nouveau, d'autant plus redoutables qu'elles sont douces (§170-179). L'économie de l'attention capte notre temps et notre regard, exploite nos fragilités psychiques, nous rend captifs sans jamais nous enchaîner. Le contrôle social par les données anticipe nos gestes, oriente nos choix, nous enferme dans des profils. Le « colonialisme des données » s'approprie la matière même de nos vies pour la transformer en pouvoir.<\/p>\n<p>Ce sont là des formes inédites d'aliénation, qui ne portent plus de fers mais des interfaces séduisantes. La liberté, à l'ère numérique, ne se défend donc plus seulement contre des tyrans, mais contre des mécanismes conçus pour nous plaire. Elle se protège par la sobriété — reprendre la maîtrise de son temps —, par la transparence des filières, et par un souci constant des plus vulnérables, toujours les premières victimes de ces servitudes.<\/p>\n<h4 class=\"cours-h\">Choisir devient un acte moral<\/h4>\n<p>De ce regard naît une exigence très concrète, jusque dans la vie ordinaire d'un établissement : choisir un logiciel, signer un contrat, adopter un outil n'est jamais un acte purement gestionnaire. C'est un acte moral, qui engage toute une filière et, à travers elle, des personnes que l'on ne verra jamais.<\/p>\n<p>Interroger la provenance des données, l'empreinte énergétique, les conditions de travail derrière un service, la protection des mineurs : voilà ce que l'encyclique appelle un devoir de vigilance. Ce n'est pas de la paperasse : c'est la solidarité rendue concrète, l'extension du « prochain » jusqu'aux invisibles de la chaîne numérique.<\/p>\n<blockquote class=\"cours-cite\">« Derrière chaque écran, il y a des visages et de la matière. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Pour votre communauté, ce module ouvre un chantier inattendu : celui d'un usage responsable, presque d'une écologie intégrale du numérique. Cartographier la chaîne cachée d'un outil banal, se doter de critères d'achat responsable, préférer parfois la sobriété à la dernière nouveauté : autant de gestes qui font de l'établissement un acteur de justice.<\/p><p>Et il enseigne, sans un mot de morale, une leçon décisive aux élèves. En montrant que derrière chaque écran il y a des visages et de la matière, l'école forme des consciences attentives, capables de relier leurs gestes quotidiens à leurs conséquences lointaines. C'est là, très concrètement, éduquer à la liberté.<\/p><\/div>","M6":"<p>Il existe une frontière que la technique, si loin qu'elle avance, ne devrait jamais franchir : celle où une machine déciderait, seule, de donner la mort. À ce seuil, l'encyclique consacre ses pages les plus graves et les plus fermes. Sa réponse ne connaît aucune ambiguïté : aucun algorithme, aussi sophistiqué soit-il, ne peut rendre la guerre moralement acceptable (§197-198).<\/p>\n<p>Ce module dépasse pourtant la seule question des armes. Il oppose deux logiques qui traversent toute la vie sociale : la culture du pouvoir, qui règle les rapports par la force, et la civilisation de l'amour, qui les fonde sur la justice et la charité. Et il montre que l'école, jusque dans une cour de récréation, est déjà un atelier de paix.<\/p>\n<h4 class=\"cours-h\">La responsabilité ne se délègue pas<\/h4>\n<p>L'expression même d'« agent moral artificiel » est une contradiction dans les termes. La morale, en effet, suppose un sujet : quelqu'un qui délibère, qui choisit, et qui répond de son choix. Une machine peut exécuter une règle ; elle ne peut pas assumer une responsabilité. Confier à un système autonome une décision létale, ce n'est donc pas seulement risquer l'erreur : c'est diluer la responsabilité jusqu'à la faire disparaître, laisser des morts sans que personne, nulle part, n'en réponde (§198).<\/p>\n<p>De là l'exigence martelée par l'encyclique : un contrôle humain effectif sur la force (§199-200). Trois critères la précisent : que la chaîne des responsabilités demeure toujours identifiable ; que le temps du jugement moral ne soit jamais sacrifié à la seule rapidité ; que soit protégée la distinction entre combattants et civils. Ce ne sont pas des détails techniques : ce sont les remparts de notre humanité en temps de crise.<\/p>\n<h4 class=\"cours-h\">Désarmer les mots<\/h4>\n<p>Mais la guerre, rappelle l'encyclique, commence bien avant les armes — elle commence dans le langage. Avant les bombes, il y a les récits qui déshumanisent l'adversaire, la « fabrique des peurs » (§132-134) qui prépare les consciences à l'affrontement. Et l'IA, capable de produire à l'infini textes, images et vidéos trompeuses, décuple cette puissance de manipulation.<\/p>\n<p>D'où une tâche éducative de première importance : apprendre à « désarmer les mots ». Repérer ce qui vise l'émotion plutôt que la vérité, démonter les mécanismes de la désinformation, refuser de relayer la haine : ce sont là des gestes de paix concrets. Car la paix véritable n'est ni l'absence de conflit ni un équilibre de la terreur : elle est, dit le texte, fruit de la justice et de la charité (§205).<\/p>\n<h4 class=\"cours-h\">L'école, atelier de paix<\/h4>\n<p>On pourrait croire ces enjeux lointains, réservés aux chancelleries et aux états-majors. Ce serait une erreur. La même logique de pouvoir qui arme les machines se rejoue, à petite échelle, dans un couloir d'établissement : la rumeur qui condamne sans preuve, le cyberharcèlement qui détruit en meute, le mépris qui déshumanise l'autre.<\/p>\n<p>L'école devient alors, très concrètement, un atelier où l'on apprend la paix. Un projet contre le cyberharcèlement, un débat sur la fiabilité des récits en ligne, une médiation patiemment conduite entre deux élèves : voilà comment une communauté éducative bâtit, pierre après pierre, la civilisation de l'amour. Les artisans de paix dont parle l'Évangile (Mt 5,9) ne sont pas d'abord des diplomates : ce sont des éducateurs.<\/p>\n<blockquote class=\"cours-cite\">« Aucun algorithme ne rend la guerre acceptable. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Pour votre établissement, ce module se traduit en éducation au discernement des récits, en projets concrets contre la violence en ligne, en apprentissage du désaccord pacifique. Autant de manières de préparer des citoyens capables de résister, demain, aux manipulations de masse.<\/p><p>Il rappelle enfin une conviction qui traverse toute l'encyclique : la technique la plus avancée ne dispense jamais l'homme de sa conscience. Sur les questions de vie et de mort, la décision doit rester humaine — consciente, responsable, capable de rendre compte. La former dès l'école, c'est déjà servir la paix.<\/p><\/div>","M7":"<p>Toute la formation conduit à ce dernier seuil : l'instant où la doctrine devient acte, où les convictions se changent en décisions. L'encyclique, à dessein, ne s'achève pas sur une théorie mais sur une figure et une consigne. La figure, c'est encore Néhémie, le bâtisseur des remparts. La consigne, c'est cet avertissement de saint Paul : « que chacun prenne garde à la manière dont il bâtit » (1 Co 3,10).<\/p>\n<p>Car il ne suffit pas de bâtir ; encore faut-il savoir sur quoi, et comment. Ce module ne transmet pas de nouveau contenu : il rassemble tout le parcours et le tourne vers l'action, en aidant chaque établissement à écrire sa propre charte et son plan d'action — sa manière à lui de mettre l'IA au service de la personne.<\/p>\n<h4 class=\"cours-h\">Le sage architecte<\/h4>\n<p>L'encyclique décrit les appuis du « sage architecte » — celui qui construit sans élever une nouvelle Babel (§237-240). Ils sont quatre : la fidélité à la vérité, l'investissement dans l'éducation, le soin patient des relations, l'amour de la justice et de la paix. Ce ne sont pas des slogans à afficher, mais des fondations à couler : tout édifice éducatif qui tiendra reposera sur elles.<\/p>\n<p>Ces quatre appuis se déploient, pour une école, en sept engagements concrets : placer la personne avant la performance ; éduquer au discernement plutôt qu'au seul usage ; cultiver l'attention et la sobriété ; protéger les mineurs ; assurer l'inclusion et la justice d'accès ; garantir transparence et responsabilité ; nouer l'alliance éducative. La charte que vous rédigerez n'est rien d'autre que la traduction de ces engagements en gestes vérifiables.<\/p>\n<h4 class=\"cours-h\">Des bâtisseurs, non des spectateurs<\/h4>\n<p>Contre une tentation très contemporaine — celle de se croire dépassé, de subir l'IA comme une fatalité —, Léon XIV oppose un refus net de la résignation (§241). Nous ne sommes pas condamnés à regarder le monde se transformer sans nous. Comme au temps de Néhémie, chacun reçoit un tronçon de mur : une part de responsabilité à sa mesure, qui, jointe à celle des autres, relève la cité.<\/p>\n<p>Et le texte offre, pour finir, le critère le plus bouleversant qui soit, emprunté au chant de Marie, le Magnificat : évaluer nos technologies « avec les yeux des petits » (§244). Non du côté des puissants, des performants, des inclus — mais du côté des plus fragiles, des laissés-pour-compte, des invisibles. Une IA est-elle juste ? Regardez qui elle sert en dernier, et qui elle oublie en premier. Vous aurez votre réponse.<\/p>\n<h4 class=\"cours-h\">Votre pierre est prête<\/h4>\n<p>C'est pourquoi le livrable de cette formation n'a rien d'un examen scolaire. Il s'agit d'une œuvre : une charte « IA &amp; dignité » et un plan d'action — une mesure, un responsable, une échéance, un indicateur pour chacun des sept engagements. Un document vivant, présentable aux familles comme aux autorités, qui engage réellement la communauté.<\/p>\n<p>Rédiger cette charte, c'est poser sa propre pierre dans le rempart. Modeste, peut-être, à l'échelle du monde ; décisive à l'échelle des élèves qui vous sont confiés. Car c'est là, dans une salle de classe précise, avec des visages précis, que se joue concrètement la question de toute l'encyclique : l'homme restera-t-il, à l'ère des machines, le sujet de son histoire ?<\/p>\n<blockquote class=\"cours-cite\">« Non des spectateurs résignés, mais des bâtisseurs d'espérance. »<\/blockquote>\n<div class=\"cours-decisif\"><span class=\"lab\">Pourquoi c'est décisif<\/span><p>Pour votre établissement, ce module est le moment de la synthèse et de l'engagement : rassembler l'équipe, arbitrer les priorités, écrire noir sur blanc ce à quoi l'on tient, et se donner les moyens de le vérifier. Une charte qui dort dans un tiroir ne vaut rien ; une charte assortie d'indicateurs et d'échéances transforme une intention en institution.<\/p><p>Vous voici donc au terme du parcours, et à son commencement véritable. La doctrine est posée, le discernement exercé, les outils en main. Votre pierre est prête. Il ne reste plus qu'à la poser — et à bâtir, non la tour de l'orgueil, mais la ville de la communion.<\/p><\/div>"};

const ACTIVITES = {"M1":[{"t":"H5P — Interactive Video (12 min)","d":"Capsule « L'IA, ce qu'elle est / ce qu'elle n'est pas » : quatre questions de contrôle sur §97-99.","kind":"qcm","data":{"consigne":"Regardez la capsule, puis répondez aux quatre points d'arrêt : calcul vs expérience, imitation vs compréhension, « cultivée » vs « construite », conscience morale (§97-99).","questions":[{"q":"Calcul vs expérience (§99) — L'IA surpasse l'humain en vitesse et en ampleur de calcul. De quoi reste-t-elle pourtant privée ?","o":[["De l'expérience vécue : ces systèmes ne connaissent ni la joie ni la douleur et n'ont pas de corps",1],["De la capacité à calculer plus vite que l'humain",0],["De la capacité à traiter de grands volumes de données",0],["De la capacité à reconnaître une image",0]],"fb":"§99 : ces systèmes « ne vivent pas d'expérience, ne possèdent pas de corps, ne connaissent ni la joie ni la douleur »."},{"q":"Imitation vs compréhension (§99) — L'IA imite certaines fonctions de l'intelligence humaine. Qu'est-ce que cela n'implique PAS ?","o":[["Qu'elle habite l'horizon affectif, relationnel et spirituel dans lequel l'humain devient sage",1],["Qu'elle peut simuler de l'empathie",0],["Qu'elle surpasse l'humain sur certaines tâches précises",0],["Qu'elle traite le langage à grande échelle",0]],"fb":"§99 : l'IA « peut simuler de l'empathie », mais « n'habite pas l'horizon affectif, relationnel et spirituel dans lequel l'humain devient sage »."},{"q":"« Cultivée » vs « construite » (§98) — Quelle formulation décrit le mieux ces systèmes ?","o":[["Ils sont davantage cultivés que construits ; même leurs concepteurs en savent peu sur leur fonctionnement réel",1],["Ils sont entièrement construits, dans le moindre détail, par leurs développeurs",0],["Ils sont programmés ligne à ligne au moyen de règles explicites et transparentes",0],["Ils sont pleinement prévisibles pour ceux qui les conçoivent",0]],"fb":"§98 : ils sont « davantage cultivés que construits » ; même leurs
